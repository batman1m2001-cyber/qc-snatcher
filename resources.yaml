# Local llama.cpp — gemma4-e4b-envi-pruned-q8_0 (self-hosted, ngrok basic auth).
# base_url embeds user:pass so httpx builds a proper Authorization: Basic header.
# api_key is unused by the server but openai SDK rejects empty strings.
llm:e4b-local:
  api_type: openai
  api_key: unused
  base_url: ${E4B_LOCAL_BASE_URL}
  model: gemma4-e4b-envi-pruned-q8_0.gguf
  cost_per_input_token: 0.0
  cost_per_output_token: 0.0
  max_retries: 3
  retry_base_delay: 2.0
  retry_min_delay: 1.0
  retry_max_delay: 10.0

# Seminar ("Workflow Is All You Need"): both go through the seminar runner's model
# router (ai-workflow-seminar, /llm/v1), which holds the real keys. A plain model
# name reaches the in-house model (Edupia gateway, gemma-4-E2B-it); `openai:<name>`
# reaches OpenAI. api_key is the seminar password the router checks.
llm:seminar-inhouse:
  api_type: openai
  api_key: ${SEMINAR_PASSWORD:seminar-local}
  base_url: ${SEMINAR_LLM_URL:http://127.0.0.1:8000/llm/v1}
  model: inhouse
  max_retries: 3
  retry_base_delay: 2.0
  retry_min_delay: 1.0
  retry_max_delay: 10.0

llm:seminar-gpt-4o:
  api_type: openai
  api_key: ${SEMINAR_PASSWORD:seminar-local}
  base_url: ${SEMINAR_LLM_URL:http://127.0.0.1:8000/llm/v1}
  model: openai:gpt-4o
  max_retries: 3
  retry_base_delay: 2.0
  retry_min_delay: 1.0
  retry_max_delay: 10.0

# =============================================================================
# Corpus Retrieval — vector stores + doc store
# =============================================================================
#
# The four `-pg` / `-triton` blocks below, named by `retrieval.*` in
# `models.yaml`. `require_remote_retrieval()` refuses anything that resolves
# to a local backend.
#
# NOTE: edit this file by hand. `ResourceHub.register()` persists through to
# storage and rewrites the file without comments.

# --- production ---------------------------------------------------------------
#
# Defining these costs nothing when unused: `ResourceHub.get()` instantiates
# lazily, so a block nothing references never imports psycopg and never needs
# its DSN to resolve.
#
# Schema + backfill: `operonx-run create_schema` (src/jobs/ingest/schema.sql)
# and `operonx-run ingest --set seed=true`. The base tables are the partner's,
# unchanged.
#
# `metadata_columns` is what a hit carries back, and `assemble_side` reads
# `policy_id` and `severity` straight off it. `policy_id` is the variant id
# (`POS-331#2`); the document it names holds that one phrasing, so a hit
# needs no second coordinate.
#
# `sample_type` is deliberately absent: constant per table and nothing reads
# it, while the DDL's CHECK requires the singular spelling.

vector_store:corpus-pos-pg:
  api_type: pgvector
  metric: cosine
  dsn: ${PG_DSN}
  table: positive_embedding
  metadata_columns: [policy_id, knowledge_id, severity]

vector_store:corpus-cvo-pg:
  api_type: pgvector
  metric: cosine
  dsn: ${PG_DSN}
  table: carveout_embedding
  metadata_columns: [policy_id, knowledge_id, severity]

# No `collection:` — the graph passes collection="positives" / "carveouts" on
# every DocFetchOp, and schema.sql creates views under those names
# so the literal resolves. The views also alias knowledge_id -> group_id and
# join knowledge_info for group_name.
doc_store:corpus-pg:
  api_type: postgres
  dsn: ${PG_DSN}

# The only embedder. Local, deploy and selfcheck all come here.
#
# `base_url` is a gRPC host:port with no scheme — TLS is selected by `ssl`,
# not by the address, which is why an https:// URL here fails in a way that
# reads like a certificate problem.
#
# The endpoint absorbed the tokeniser on 2026-09-21. The served model is
# `bge_m3_embed`, it takes one BYTES input named TEXT, and it truncates at
# 1024 itself — so `tokenizer_path` and `max_length` are gone rather than
# left here meaning nothing. `input_name` selects that mode: unset, the
# client tokenises and sends token ids instead, which is the contract the
# older served model spoke.
#
# `model`, `input_name` and `embed_batch_size` are the served model's
# contract, not settings: 8 is the server's max batch — above it Triton
# rejects the request outright.
#
# A store seeded before 2026-09-21 (truncation 256, not 1024) must be
# re-ingested — a stale seed answers every query and reports nothing.
embedding:corpus-triton:
  api_type: triton
  # Defaults are the deployed endpoint, so an unset variable still points
  # somewhere real rather than failing like an outage.
  base_url: ${TRITON_EMBEDDING_URL:aic-ds2-collector-assistant-embedding.aws.coreai.win.dev:443}
  ssl: ${TRITON_EMBEDDING_SSL:true}
  model: bge_m3_embed
  input_name: TEXT
  output_name: sentence_embedding
  embed_batch_size: 8
  dimensions: 1024

# =============================================================================
# Observability Configurations
# =============================================================================
#
# Langfuse + OpenTelemetry tracers were removed to eliminate PII leakage:
# the pipeline passes full `Conversation` objects (with agent + customer
# transcripts, including contact info in scoring payloads) into every LLM
# op. Any remote tracer that captures op inputs would serialise that raw
# content and ship it to an external host. Only in-process `local` tracer
# (writes JSON to disk under PIPELINE_TRACER_LOCAL_DIR) remains supported.
