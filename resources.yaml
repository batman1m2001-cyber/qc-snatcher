# operonx resource registry. `models.yaml` picks which entry serves each stage.
# Format: category:name — category is inferred from key prefix

# =============================================================================
# OAuth2 Token Providers
# =============================================================================

# Databricks OAuth2 (for Claude on Databricks)
oauth2:databricks:
  token_url: ${DATABRICKS_HOST}/oidc/v1/token
  client_id: ${DATABRICKS_CLIENT_ID}
  client_secret: ${DATABRICKS_CLIENT_SECRET}
  scope: all-apis
  refresh_interval: 1800

# =============================================================================
# LLM Configurations
# =============================================================================

# Databricks Claude 4 Sonnet (via OAuth2 auth)
llm:db-claude-4-sonnet:
  api_type: db-anthropic
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: system.ai.claude-sonnet-4
  cost_per_input_token: 0.000003
  cost_per_output_token: 0.000015
  max_retries: 10
  retry_base_delay: 30.0   # seconds; doubles each attempt before jitter
  retry_min_delay: 10.0    # floor — never retry sooner than this
  retry_max_delay: 120.0   # cap at one full QPM window

# Databricks Claude 4 Sonnet with extended thinking enabled.
# Anthropic requires temperature=1.0 and forbids top_p when thinking is on.
# Hush skips null values in _prepare_params, so setting them to null strips
# them from the request. budget_tokens caps reasoning tokens; final content
# tokens = max_tokens - budget_tokens (roughly).
llm:db-claude-4-sonnet-thinking:
  api_type: db-anthropic
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: system.ai.claude-sonnet-4
  cost_per_input_token: 0.000003
  cost_per_output_token: 0.000015
  max_retries: 10
  retry_base_delay: 30.0
  retry_min_delay: 10.0
  retry_max_delay: 120.0
  generation_extras:
    top_p: null
    temperature: 1.0
    thinking:
      type: enabled
      budget_tokens: 4096
    max_tokens: 8192

# Databricks Claude 4 Sonnet (via OAuth2 auth)
llm:db-claude-4-6-sonnet:
  api_type: db-anthropic
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: system.ai.claude-sonnet-4-6
  cost_per_input_token: 0.000003
  cost_per_output_token: 0.000015
  max_retries: 10
  retry_base_delay: 30.0   # seconds; doubles each attempt before jitter
  retry_min_delay: 10.0    # floor — never retry sooner than this
  retry_max_delay: 120.0   # cap at one full QPM window
  # Claude 4.6 rejects requests setting both temperature + top_p. Strip
  # top_p (hush base.py skips None values when building API params).
  generation_extras:
    top_p: null
    thinking:
      type: disabled

# Databricks Gemini 2.5 Pro (via OAuth2 auth)
# Cost: rough Google pricing for gemini-2.5-pro at <200K context.
# Verify with Databricks billing console once you confirm endpoint is live.
llm:db-gemini-2-5-pro:
  api_type: db-gemini
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: databricks-gemini-2-5-pro
  cost_per_input_token: 0.00000125
  cost_per_output_token: 0.000005
  max_retries: 10
  retry_base_delay: 30.0
  retry_min_delay: 10.0
  retry_max_delay: 120.0

# Gemini 2.5 Pro with maximum thinking. 2.5 Pro thinks by default; this
# variant bumps reasoning_effort to `high` for deeper chain-of-thought
# (used for optimizer critique tasks that need multi-step reasoning over
# violation cases). Anthropic-style `thinking:` field does not apply here.
llm:db-gemini-2-5-pro-thinking:
  api_type: db-gemini
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: databricks-gemini-2-5-pro
  cost_per_input_token: 0.00000125
  cost_per_output_token: 0.000005
  max_retries: 10
  retry_base_delay: 30.0
  retry_min_delay: 10.0
  retry_max_delay: 120.0
  generation_extras:
    reasoning_effort: high

# Databricks Gemini 3 Flash via AI Gateway (system.ai.* model catalog)
# Thinking cannot be fully disabled per Google docs — `reasoning_effort: low`
# minimises it (≈ thinking_level=minimal). Cost: placeholder using 2.5-flash
# pricing as proxy until 3.0 list pricing is published.
llm:db-gemini-3-flash:
  api_type: db-gemini
  api_key: oauth2:databricks
  base_url: ${DATABRICKS_HOST}/ai-gateway/mlflow/v1
  model: system.ai.gemini-3-flash
  cost_per_input_token: 0.000000075
  cost_per_output_token: 0.0000003
  max_retries: 10
  retry_base_delay: 30.0
  retry_min_delay: 10.0
  retry_max_delay: 120.0
  generation_extras:
    reasoning_effort: minimal

# Gemini 3 Flash — reasoning_effort ladder (low/medium/high) for per-op
# think-budget tuning. Same model + pricing; only reasoning_effort differs.
# Pick one for a stage in `models.yaml` when it needs heavier reasoning
