# Iconic-keyword pre-filter for v3 sentiment_agent.
#
# Purpose: cheap gate BEFORE the LLM scanner — drop ~70% of low-signal calls
# so we only spend LLM tokens on ones likely to contain a violation.
#
# Compiled into a single case-insensitive regex; matched as substring against
# concatenated AGENT-turn text. A file passes the filter if ≥1 phrase hits.
#
# Recall / cost measurement (pilot rounds 1..4 + 3.2, 1703 labeled audios):
#   recall       = 79.9% (358 TP / 448 gold VP)
#   filter_rate  = 30.7% (522 pass / 1703 total) → 69% LLM cost savings
#   FN           = 90 real VPs missed → covered by ML filter layer (planned)
#
# On live batch (live_20260629, 5057 calls): only 3.8% pass through filter.
# The gap between pilot (30%) and live (3.8%) is expected — pilot is curated
# labeled data, live has many trivial calls (BT3 no-answer, quick cooperation).
#
# Groups are for organization only. Loader flattens all `phrases` lists and
# compiles a single regex. Duplicates across groups are OK — dedup on load.
#
# Tune rules:
#   - Prefer 2-token phrases (iconic, rare in benign context).
#   - Add 3-4 token phrases only when 2-token form is too generic.
#   - Add ASR variants of the same phrase as siblings (e.g. `linh linh`,
#     `linh lan` for `linh tinh`).
#   - Avoid single-word entries unless truly iconic (e.g. `đéo`, `địt`).

