    severity: warning
    description: 'AGENT gán ý đồ ''cố tình không hiểu'' cho KH — gán ý đồ + implicit patronize (KH cố tình không hiểu ≈ KH giả bộ ngu). Áp dụng cả khi có softener ''hình như / em thấy''. Khác ''3rd party có dấu hiệu cố tình'' (đó là 3rd party legal template). Marker: subject là KH direct + verb ''không hiểu''.'
