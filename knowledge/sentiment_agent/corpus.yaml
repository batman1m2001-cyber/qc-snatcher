    severity: tich_cuc
    description: AGENT POLITE INTERRUPT với softener 'em XIN NGẮT LỜI' + xưng hô lịch sự — dùng khi KH đang đi lạc topic / buộc tội bank / lặp lại lý do không liên quan, CB cần ngắt lời để giải thích thông tin nghiệp vụ (khoản vay chính chủ, trách nhiệm pháp lý, phương án hỗ trợ). Softener 'xin' là marker lịch sự rõ. KHÔNG áp dụng nếu (a) KH đang hỏi info nghiệp vụ hợp lệ (verification, hỏi lãi, hỏi phương án) mà bị ngắt, (b) là 'im đi / câm đi / dừng ngay' không có 'xin'.
