    description: AGENT nhận xét/định hướng lại cách KH nhìn nhận vấn đề, không kèm từ ngữ công kích. Là điều hướng trao đổi. Không áp dụng nếu là chê nhận thức ('anh chị nghĩ kiểu gì vậy', 'anh chị hiểu kiểu gì vậy').
  - id: f4eed04f-6d6d-4864-bb5d-6419ae6274da
    content: anh nghe hiểu vấn đề giúp em là không hỏi lại nhiều lần nhá | em đã nhắc thông tin này nhiều lần rồi mình nắm giúp em ạ
    severity: tich_cuc
    description: AGENT nhắc KH đã trao đổi thông tin nhiều lần và đề nghị KH nắm để tránh hỏi lại, có softener 'giúp em / ạ / nhá'. Là điều hướng lịch sự. Không áp dụng nếu là mệnh lệnh cắt lời ('đừng lấy lý do ra nữa', 'lần sau anh phải nói ngay từ đầu').
