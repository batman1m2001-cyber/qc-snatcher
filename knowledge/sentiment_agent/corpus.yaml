    severity: tich_cuc
    description: AGENT phân tích công việc, nguồn thu nhập và thời gian quá hạn để làm rõ nguyên nhân chưa thanh toán. Là phân tích nghiệp vụ có số liệu cụ thể. Không áp dụng nếu kèm gán ý đồ ('anh cố tình để chậm hạn', 'đấy là do bản thân anh').
