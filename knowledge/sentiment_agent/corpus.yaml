    content: tức là đã đọc nhưng mà không muốn trả lời á | tức là chị chưa muốn phản hồi á | tức là anh chưa muốn trao đổi á
    severity: tich_cuc
    description: AGENT diễn giải / confirm lại ý KH bằng câu hỏi có MARKER `á` CUỐI CÂU đơn — verification form. CHỈ áp dụng khi câu kết thúc bằng `á` đơn ở CUỐI. **KHÔNG áp dụng** nếu (a) là `hay sao ạ / hay như thế nào ạ` (rhetorical accusation không phải verification), (b) `á` xuất hiện giữa câu như discourse continuer trong narrative, (c) kèm giọng châm chọc rõ.
  - id: e96631c8-5177-4d75-ab0c-1572e795e931
    content: còn nếu mà em vẫn im lặng như vậy thì mời em lên tòa án của huyện để xử lý tổng nợ | nếu anh chị vẫn im lặng thì mời anh chị lên tòa án huyện để xử lý
    severity: tich_cuc
