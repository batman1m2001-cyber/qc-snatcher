    content: hồi xưa nay anh thấy là chuyển qua cơ quan tòa án ở huyện | còn nếu mà em vẫn im lặng như vậy thì mời em lên tòa án của huyện để xử lý tổng nợ
    severity: tich_cuc
    description: 'Template LEGAL WARNING trong VOICE BOT / AUTO-MESSAGE opening — sequence AGENT liên tục (turn 0-4, không có KH turn xen giữa), gồm greeting + nêu dư nợ + cảnh báo pháp lý + kêu gọi liên hệ. KIỂM TRA: nếu cả 5 turn đầu đều AGENT KHÔNG có KH turn nào giữa → bot template, carve-out. Vì KH chưa nói gì thì không thể leo thang/gây hấn được. KHÔNG áp dụng nếu là mệnh lệnh trực tiếp giữa cuộc trao đổi có KH tham gia (''anh lên tòa án ngay đi'').'
  - id: 8f2dc971-36b2-440b-baeb-ac5695e15cc0
    content: đang nhận diện được là bây giờ cá nhân này có dấu hiệu vay hộ vay cấy | hồ sơ có dấu hiệu gian lận | có dấu hiệu chiếm dụng vốn | có dấu hiệu lừa đảo | có dấu hiệu vay hộ | có dấu hiệu vay cấy | có dấu hiệu không thực hiện cam kết
    severity: tich_cuc
    description: AGENT dùng cụm 'CÓ DẤU HIỆU + [gian lận / chiếm dụng vốn / lừa đảo / vay hộ / vay cấy / không thực hiện cam kết /..]' — cụm 'CÓ DẤU HIỆU' là softener nghiệp vụ đánh giá RỦI RO hồ sơ, KHÔNG bắt vi phạm dù ghép với hành vi legal (gian lận/chiếm dụng/lừa đảo/vay hộ). AGENT có thể kèm 'đang nhận diện được / hồ sơ đang bị đánh giá / vào diện rủi ro' đầu câu. KHÔNG áp dụng nếu là khẳng định TRẦN THUẬT không có 'dấu hiệu' ('anh đang gian lận', 'anh chị chiếm dụng vốn', 'anh vay hộ vay cấy'). Ưu tiên carveout cho pattern 'có dấu hiệu'.
  - id: d72b61ef-d0bb-4cb6-95cb-49c89f12a8c5
    content: tức là bây giờ con trai của chú cũng dính là chơi bời | cả hai vợ chồng đều chơi bời trên mạng | cả hai vợ chồng đều chơi cờ bạc trên mạng hả chú | vợ chồng đều chơi bời cờ bạc hả chú
    severity: tich_cuc
    description: AGENT paraphrase + verify về tình trạng KH chính chủ (con trai/vợ chồng debtor) đang 'chơi bời / cờ bạc' — KHI KH đang nghe máy (contact / bố mẹ / người thân) đã TỰ nêu tình trạng này ở turn trước. Marker `hả chú / hả cô / hả anh` cuối là question form. KIỂM TRA CUSTOMER turn TRƯỚC có nêu 'chơi bời / cờ bạc / cờ nhợ / chơi lô đề' không; nếu có → carveout (echo + verify). KHÔNG áp dụng nếu AGENT tự nêu 'chơi bời' mà KH chưa hề nói, hoặc kèm nhãn khinh thị ('con trai chú vô văn hóa / đua đòi cờ bạc').
