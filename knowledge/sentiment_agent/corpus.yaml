    severity: tich_cuc
    description: AGENT hỏi BT3 về thời gian giữ máy của người vay để xác định cách liên hệ tiếp. Là khai thác thông tin nghiệp vụ. Không áp dụng nếu là mỉa mai cách KH nghe máy ('bật máy mà để điện thoại một bên thì tới khi nào mới xử lý').
