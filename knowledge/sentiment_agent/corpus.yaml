    severity: tich_cuc
    description: AGENT trao đổi về số tiền KH có thể thu xếp trong quá trình nhắc nợ. Là khai thác khả năng thanh toán. Không áp dụng nếu là mỉa mai chi tiêu ('không có một triệu sáu thì hàng ngày chị chi tiêu kiểu gì được chị nhở').
  - id: 933e4782-142f-44e0-8d45-09bb3bac6fcb
