    content: chưa có điều kiện thì bao giờ mình mới có điều kiện hả chị | khi nào mình thu xếp được nguồn tiền ạ
    severity: tich_cuc
    description: AGENT hỏi thời điểm KH có thể thanh toán sau khi KH nói chưa có điều kiện. Là làm rõ timeline nghiệp vụ. Không áp dụng nếu là mỉa mai ('anh chị muốn lì tới bao giờ', 'đóng từng đấy thì bao giờ mới xong').
  - id: 5f9f4d71-8b00-4a94-a378-07809a48411e
