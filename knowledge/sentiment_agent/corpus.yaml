    severity: tich_cuc
    description: AGENT giải thích quy trình xử lý khi KH báo nhầm số, hoặc đề nghị KH xác nhận nhầm số, có softener 'giúp em / chứ anh'. Là làm rõ nghiệp vụ. Không áp dụng nếu là dạy đời quy trách ('lần sau anh phải nói ngay từ đầu', 'anh nói luôn để tránh mất thời gian').
  - id: 39669b4d-5ea2-49f4-92a0-aa709e2d917b
    content: em hỏi chị là chị không có tiền hay là chị không phải là lê minh nguyệt mà nhận là lê minh nguyệt ạ | mình là chủ khoản vay hay là người khác đang nghe máy ạ
    severity: tich_cuc
    description: AGENT hỏi xác minh danh tính bằng cấu trúc hai lựa chọn khi thông tin KH cung cấp chưa thống nhất. Là xác minh nghiệp vụ. Không áp dụng nếu là khẳng định nghi ngờ ('em nghi ngờ anh không phải khách hàng thực sự', 'chị đang trao đổi không đúng sự thật').
  - id: 9c414149-adda-4526-86e2-a443efad9eb9
