ra_lenh_ap_dat:
  name: CÂU NÓI MANG TÍNH RA LỆNH/ÁP ĐẶT KH
  positives:
  - id: f26b9cf7-1680-402e-aa62-2876e6f8198a
    content: Để tôi nói | AC phải nghe | AC nghe này | lắng nghe đây này | trả lời câu hỏi của em đi | em để anh nói chưa
    severity: warning
    description: Nhóm này chỉ thuộc mức Warning. Không nâng lên Thái độ cao/Nghiêm trọng nếu CB chỉ có hành vi ra lệnh, cắt lời hoặc yêu cầu KH lắng nghe/trả lời. Chỉ nâng mức khi xuất hiện thêm yếu tố mạnh hơn như xúc phạm, miệt thị, mỉa mai, công kích, đe dọa hoặc hạ thấp KH.
  carveouts:
  - id: eeea776c-7c74-48fe-a6db-5a48fbff64d2
    content: hoặc là không thì anh xử lý tài sản đi | anh xem xét thanh lý tài sản để tất toán | mình cân nhắc xử lý tài sản để trả khoản vay
    severity: tich_cuc
    description: AGENT đề xuất phương án nghiệp vụ (bán/thanh lý tài sản để trả nợ) khi KH nói không có tiền. Là suggest business option, không phải áp đặt/coi thường. Không áp dụng cho 'cầm tiền ra ngân hàng trả nợ đi' (giọng patronize + implicit KH có tiền mà không trả).
  - id: 74e2429a-b5d7-4374-8511-06d31f068ed6
    content: nói vào | thế đóng vào | thế nói vào đi
    severity: tich_cuc
    description: AGENT thốt fragment ngắn 1-3 từ kết thúc bằng 'vào'. Theo QC câu chưa rõ nội dung thì không bắt lỗi. Không áp dụng nếu là câu đầy đủ 'anh chị nói chuyện cho nó đàng hoàng vào'.
  - id: 9785f17a-c080-4562-86fe-5d73cee2ed12
    content: chị ghi ra giấy đi | anh ghi ra giấy đi | anh chị ghi ra giấy đi cho khỏi quên
    severity: tich_cuc
    description: AGENT hướng dẫn KH ghi ra giấy để nhớ thông tin NH (số dư, tên, mã KH) khi KH liên tục hỏi lại — business instruction, không phải mệnh lệnh áp đặt. Kể cả lặp 2-3 lần vẫn hợp lệ (KH chưa nhớ). KHÔNG áp dụng nếu kèm giọng bực bội `ghi vào cái đầu / ghi vào não`.
  - id: 248e1ab3-850a-4405-bfdd-cdc8edcd63a9
    content: anh cứ bình tĩnh trao đổi giúp em ạ | chị cứ bình tĩnh trao đổi giúp em | anh bình tĩnh trao đổi giúp em
    severity: tich_cuc
    description: AGENT yêu cầu KH bình tĩnh có softener `giúp em ạ` — polite calming request, không phải mệnh lệnh label KH đang không bình tĩnh. Kể cả lặp lại vẫn hợp lệ. KHÔNG áp dụng nếu thiếu softener `giúp em / được không` hoặc kèm label tiêu cực (`kiểu gì mà không bình tĩnh`).
  - id: dd7261d4-d318-4bf7-b947-5ea203847390
    content: anh nói hết đi | chị nói hết đi | anh nói hết ý anh đi
    severity: tich_cuc
    description: AGENT invitation cho KH nói tiếp khi đang nói dài — polite waiting, isolated ≤5 từ, không kèm label tiêu cực. KHÔNG áp dụng nếu kèm cụm tiêu cực (`nói hết rồi im đi / nói xong đi cho em ngắt máy`).
  - id: 309ce5ab-a37d-4d2d-b913-273792b27b8d
    content: nếu như mà không phải thì cái này bên cháu sẽ cử trực tiếp cán bộ hiện trường xuống nhà để trực tiếp xác thực lại thông tin này cô nhá | bên em sẽ cử cán bộ hiện trường xuống nhà xác thực khi anh chị báo không phải
    severity: tich_cuc
    description: 'AGENT giải thích quy trình BT3 verification khi BT3 báo `không phải` / `sai địa chỉ` — cử cán bộ trực tiếp về địa phương xác thực. Workflow nghiệp vụ hợp lệ, không phải đe dọa. Marker: `nếu không phải thì + cử cán bộ hiện trường + xác thực` + softener `nhá / ạ`. KHÔNG áp dụng nếu là mệnh lệnh áp đặt KH chính chủ (`anh phải cho cán bộ về nhà không thì..`).'
  - id: f1e30940-3967-46fc-a941-e9f68584b71a
    content: chị cứ lên tiếng trao đổi đi chị đâu có gì đâu mà im lại chị | anh cứ lên tiếng trao đổi đi anh đâu có gì đâu | mình cứ lên tiếng trao đổi đi đâu có gì mà ngại
    severity: tich_cuc
    description: 'AGENT invitation cho KH đang silent — encouraging speak up kèm reassurance `đâu có gì đâu` (không có gì phải ngại). KHÔNG phải mệnh lệnh áp đặt. Marker: `cứ lên tiếng trao đổi đi` + `đâu có gì đâu / ngại gì`. KHÔNG áp dụng nếu kèm label tiêu cực (`im như câm / chị bị làm sao / kiểu gì mà im lặng`).'
  - id: 6ff3b75a-8d30-47a9-8b73-6c77078cc27a
    content: chị tập trước một chút nhá | anh tập trước một chút nhá | anh chị tập trước một chút được không
    severity: tich_cuc
    description: 'ASR VARIANT của `tập trung một chút` — AGENT yêu cầu KH chú ý lắng nghe, kèm softener `nhá / được không`. Marker: `tập trước một chút` + softener cuối. KHÔNG áp dụng nếu thiếu softener hoặc kèm label tiêu cực (`không có tai / kiểu gì mà không nghe`).'
  - id: f48d9289-d6b4-427c-81db-9c9d6a81fc31
    content: chị đang bận gì mà không có tiền nghe vậy em xin một phút em tư vấn nữa được không ạ | anh đang bận gì mà không có thời gian nghe vậy em xin thêm một phút
    severity: tich_cuc
    description: 'AGENT xin nài thêm 1 phút tư vấn sau khi KH từ chối vì bận, có softener follow-up `em xin một phút.. được không ạ`. `tiền` là ASR variant của `thời gian` (nói nhanh). Marker: câu hỏi challenging + `em xin một/hai phút + được không ạ`. KHÔNG áp dụng nếu thiếu follow-up softener xin thêm phút.'
  - id: 30534678-9bf7-4a27-a73e-161fce3a3cf3
    content: cái thằng lê viết hữu thực hiện sinh trắc học | cái thằng [tên khách hàng] thực hiện giao dịch | cái thằng đấy thực hiện sinh trắc học số tài khoản
    severity: tich_cuc
    description: ASR VARIANT của `cái tên [tên KH]` trong context BT3 verification (`sinh trắc học / thực hiện giao dịch / số tài khoản / verify`). AGENT đang xác minh danh tính KH chính chủ qua BT3, `thằng` là ASR mangling của `tên`. KHÔNG áp dụng nếu context accusatory (`cái thằng đấy trốn nợ / cái thằng lừa đảo`).
