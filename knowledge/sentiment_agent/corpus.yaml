  - id: fdfc1fc5-5874-4bd3-8aeb-bb52b4298eba
    content: bên tôi xin phép hủy ha | bên em xin phép hủy cuộc gọi ạ | bên em xin phép hủy ha | giờ làm im lặng bên tôi xin phép hủy | KH im lặng bên tôi xin phép hủy | im lặng bên tôi xin phép hủy ha
