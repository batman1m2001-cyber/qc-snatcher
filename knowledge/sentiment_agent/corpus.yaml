    severity: warning
    description: AGENT phán xét cách nói của KH và ra lệnh KH đổi kiểu trao đổi. KHÔNG áp dụng nếu AGENT hướng dẫn thủ tục hành chính.
  - id: 9224f917-b6e6-4be1-9b84-1d6d04ce9299
