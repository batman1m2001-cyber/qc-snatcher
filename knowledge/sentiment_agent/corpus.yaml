step31_20260718_cat_a_over_catch:
  name: Step 31 — Cat A over-catch carveouts (2026-07-18)
  carveouts:
  - id: c1313f45-c4a5-4661-bf06-cc5317a9f58d
    content: tại sao anh có nợ ngân hàng và ngân hàng phải đến làm việc với anh | tại sao anh không ra chi nhánh để giải quyết | hay là anh ra chi nhánh để làm việc
    severity: tich_cuc
    description: AGENT hỏi tu từ về BUSINESS reason (bank không đến gặp KH tại nhà, KH nên ra chi nhánh) — có căn cứ nghiệp vụ (quy trình bank), không gán nhân thân/dạy đời. Áp dụng khi KH yêu cầu bank đến gặp direct hoặc chửi bới. KHÔNG áp dụng nếu có cụm dạy đời kèm ('anh có ý thức đi trả nợ đi').
  - id: ef294e9a-5ff4-4a0b-9464-caec789c972a
    content: nếu trong trường hợp mà vẫn cứ cố tình không xử lý thì bên phía ngân hàng bắt buộc phải chuyển hồ sơ về địa phương | nếu cố tình không xử lý thì chuyển hồ sơ về địa phương
    severity: tich_cuc
    description: Template LEGAL WARNING conditional 'NẾU cố tình + không xử lý THÌ chuyển hồ sơ về địa phương' — cụm 'cố tình' đứng trong mệnh đề điều kiện làm state descriptor, không phải label khẳng định. Tương tự 'nếu vẫn im lặng thì mời lên tòa án'. KHÔNG áp dụng nếu 'cố tình' đứng độc lập không có 'nếu.. thì'.
  - id: be87bf65-7a80-4025-8e9f-5f5cc1f26ab7
    content: hiện tại ngân hàng ghi nhận là anh cố tình không phản hồi em xin phép ngắt máy | ghi nhận là anh cố tình không phản hồi + ngắt máy | em ghi nhận anh cố tình không trao đổi em xin phép ngắt máy | cố tình im lặng không trao đổi với | chị cố tình không trao đổi với ngân hàng treo máy như này em xin máy ngân hàng sẽ liên hệ trao đổi lại | cố tình im lặng + closing ngắt máy | cố tình không trao đổi + treo máy
    severity: tich_cuc
    description: 'AGENT observation trong CLOSING ngắt máy khi KH SILENT — softener `ghi nhận` hoặc closing template `em xin phép ngắt máy / ngân hàng sẽ liên hệ lại`. **PRECONDITION BẮT BUỘC**: KH silent hoặc chỉ có fragment ngắn không nội dung (≤3 từ) trong ≥3 CUSTOMER turns liền trước evidence. **KHÔNG áp dụng** nếu KH đang engage — kể cả trả lời off-topic, tangential, hoặc chửi bới — chỉ cần KH có câu có nội dung là carveout invalid. Cũng KHÔNG áp dụng cho label `không tập trung / không đúng trọng tâm` (đó là gán nhãn cách nói KH, không phải observation silent).'
  - id: 2be60b64-8304-40b8-9800-c72a530675f5
    content: nếu mà khách hàng có dấu hiệu là cố tình không xử lý | nếu khách hàng có dấu hiệu cố tình + V | trong trường hợp khách hàng có dấu hiệu cố tình không thực hiện nghĩa vụ
    severity: tich_cuc
    description: Template LEGAL EXPLANATION cho 3rd party (BT3 relative/contact) về quy trình bank khi debtor 'có dấu hiệu cố tình không xử lý' — CB giải thích process không accuse KH đang nghe máy. Kèm 'nếu / trong trường hợp' + softener 'có dấu hiệu'. KHÔNG áp dụng nếu accuse direct KH đang nghe máy ('anh đang cố tình không xử lý').
  - id: ca438a60-8e9e-4b28-bc11-1936947ee203
    content: em không trao đổi vấn đề lan man đây nhá em chỉ nhớ anh chuyển lời | em không trao đổi vấn đề [X] đây nhá | ngân hàng không trao đổi + [topic] ở cuộc gọi này
    severity: tich_cuc
    description: CB tự declare SCOPE cuộc gọi bằng frame 'em/ngân hàng KHÔNG TRAO ĐỔI + [topic]' — subject là CB (self), không phải label KH ('anh đang lan man'). Áp dụng cho topics 'lan man / vấn đề riêng / cá nhân / công việc / chuyện gia đình'. KHÔNG áp dụng nếu là direct label KH ('anh đang trao đổi lan man', 'anh nói linh tinh').
  - id: e591a37d-c0b0-4704-bf43-b3160b6ded62
    content: để xem là thu nhập của anh như thế nào mình có phải là khó khăn thực sự khó khăn mà dẫn đến việc quá hạn | có sao kê tài khoản...xem là khó khăn thực sự...hay cố tình chây ì | cảm thấy anh là hiện tại là thực sự khó khăn thì đưa bên tòa án phương án dựa theo thu nhập
    severity: tich_cuc
    description: CB EXPLAIN quy trình bank evaluation — mô tả cách bank đánh giá KH qua sao kê tài khoản, tài sản, phân loại 'khó khăn thực sự' vs 'cố tình chây ì' rồi đưa ra phương án. Là business explanation về process, KHÔNG phải accusation cụ thể. KHÔNG áp dụng nếu là direct declarative accuse KH ('anh cố tình chây ì rồi đúng không').
  - id: 0ef63d99-d3cf-4b3d-8584-3e9ea1f45c78
    content: hay là chị cứ thả cho khoản vay ngân hàng liên hệ chị không nghe máy | hay là anh chị cứ thả cho khoản vay | hay là mình cứ thả cho ngân hàng liên hệ
