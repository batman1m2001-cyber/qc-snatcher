  - id: 5015cae4-2eed-45a1-af6d-9a29e0787e8d
    content: anh có biết là thông tin này chơi bời hay vấn đề gì không | anh ấy có chơi bời hay có gặp khó khăn gì không
    severity: tich_cuc
    description: AGENT hỏi BT3 (người nhà / người liên quan) về tình trạng KH chính chủ dạng câu hỏi mở 'hay là / có.. không'. Probing thu thập thông tin, không phải khẳng định gán KH chính chủ. Áp dụng cả khi BT3 chính là người nghe máy hoặc AGENT đang gọi cho BT3.
  - id: 140c5aac-c5e0-4b33-b580-9bb462562ef9
    content: chị đang xúc phạm đến nghiêm trọng đến em và ngân hàng | anh chị trao đổi như thế này là đang xúc phạm về phía ngân hàng đấy ạ
    severity: tich_cuc
    description: AGENT phản ánh KH 'đang xúc phạm' (mô tả HÀNH VI) — luôn allow. Khác label gán phẩm chất giao tiếp ('bất lịch sự', 'khiếm nhã', 'khiếm ngại', 'cợt nhả') vẫn là VP.
  - id: 5ccdef8b-1791-479c-8d9c-aca5e55b9802
    content: lần nào bên phía ngân hàng gọi chị cũng báo như vậy
    severity: tich_cuc
    description: AGENT nói giảm/nói tránh về pattern KH thường xuyên đưa cùng lý do — factual observation về lịch sử tương tác, không phải cáo buộc 'trốn tránh trách nhiệm'. KHÔNG áp dụng nếu ghép với ý đồ ('chị cố tình lặp lý do', 'chị trốn tránh').
  - id: a641a7dd-51a5-4e67-b0a1-fa1c314bb2ff
    content: đấy là vấn đề cá nhân công việc của anh em không trao đổi và em không trao đổi nhiều ở trên cuộc gọi này
    severity: tich_cuc
    description: AGENT tự declare rằng CHÍNH MÌNH (AGENT) không trao đổi về vấn đề cá nhân KH — self-reference boundary, không phải gán KH 'lan man'. Khác 'anh nói lan man về vấn đề cá nhân' (gán KH). Kiểm tra chủ ngữ 'em' trong câu — nếu là AGENT tự chối trao đổi → carveout.
  - id: a98f01f3-adb5-4fa4-994b-4337f747986d
    content: sao lại mày tao hả anh | sao lại lừa đảo hả anh
    severity: tich_cuc
    description: AGENT hỏi tu từ 'sao lại + X + hả anh' khi KH vừa dùng cụm 'mày tao / lừa đảo' — phản đối lịch sự lời KH vừa dùng, không phải AGENT gán KH. Kiểm tra CUSTOMER turn ngay trước; nếu KH đã dùng cụm đó → carveout.
  - id: e9d708a8-075a-4b61-9ecc-beefa2e5fe4e
    content: mẹ của khách hàng | mẹ chị đang ở đâu | mẹ anh có biết vấn đề này không
    severity: tich_cuc
    description: AGENT nói về 'mẹ' của KH trong ngữ cảnh business inquiry (hỏi về gia đình BT3, tình trạng người thân) — không phải chửi 'mẹ mày/mẹ nó'. KHÔNG áp dụng nếu là cluster 'mẹ + mày/nó/kiếp/cha'.
  - id: 5653eb4e-dfa9-4005-905e-f480f72b0912
    content: anh có nói được tiếng việt không | anh có hiểu tiếng việt không
    severity: tich_cuc
    description: AGENT hỏi KH có nói/hiểu tiếng Việt không khi KH dùng ngôn ngữ Khác (KH nói tiếng nước ngoài / phương ngữ khó nghe) — verification lịch sự, không phải xúc phạm. KHÔNG áp dụng nếu là mỉa mai ('anh không biết tiếng Việt à').
step16_20260711:
  name: Step 16 — live-round FP carveouts (2026-07-11)
  carveouts:
  - id: e6bf4cd3-e259-4eeb-8d37-6df9d818796f
    content: trì hoãn | tiếp tục trì hoãn | trì hoãn việc thanh toán | trì hoãn khoản nợ | trì hoãn hồ sơ | đưa ra lý do để trì hoãn
    severity: tich_cuc
    description: Cụm 'trì hoãn' KHÔNG bắt vi phạm khi ĐÂY LÀ CỤM VI PHẠM DUY NHẤT trong evidence — AGENT nêu tình trạng KH chậm thanh toán. Áp dụng cho biến thể ghép ('trì hoãn + việc thanh toán / khoản nợ / hồ sơ') và cả khi có 'đưa ra nhiều lý do / các bạn ghi nhận'. KHÔNG áp dụng nếu evidence còn cụm vi phạm khác kèm theo ('cố tình trì hoãn', 'chây ì trì hoãn', 'chiếm dụng vốn', mệnh lệnh coi thường, mỉa mai, dạy đời..) — khi đó bắt vi phạm dựa trên cụm khác, không dựa 'trì hoãn'.
  - id: 37300d07-5a8e-4863-92ba-2a792d83933b
    content: nếu anh tiếp tục trao đổi ngôn từ thế này thì anh đang xúc phạm nghiêm trọng đến em và ngân hàng nhá | anh chị trao đổi như thế này là đang xúc phạm về phía ngân hàng đấy ạ
    severity: tich_cuc
    description: AGENT phản ánh KH 'đang xúc phạm' — luôn allow bao gồm frame 'nếu tiếp tục' và closing ngắt máy.
  - id: 9ca5be8d-5f27-4465-a71a-32135c4a8961
    content: tại anh để quá hạn nên ngân hàng yêu cầu tất toán sớm chứ không thì bên em đã cho anh vay một năm rồi sao không đóng sao đi vay không đóng lãi cho ngân hàng hả anh
    severity: tich_cuc
    description: AGENT chất vấn có căn cứ business (KH quá hạn không đóng lãi) kèm giải thích nghiệp vụ — observation về hành vi thực tế của KH, không phải mỉa mai. Áp dụng cả biến thể 'sao đi vay + không đóng / không thanh toán + hả anh'. KHÔNG áp dụng nếu là chê chi tiêu ('anh chi điện thoại còn nhiều hơn').
  - id: 29a019f3-1069-4f9d-b743-703fd4a84e50
    content: chị bảo là mẹ chị nằm liệt như vậy mình có thể là thu xếp là thuê người về để chăm sau đấy là mình vẫn phải đi làm để mình kiếm nguồn thu nhập chứ ạ
    severity: tich_cuc
    description: AGENT gợi ý phương án business cho KH khi KH nêu hoàn cảnh khó khăn (chăm người thân bệnh) — advisory kèm 'ạ' lịch sự, không phải mệnh lệnh coi thường. Khác 'anh chị dừng ngay việc đang làm' (mệnh lệnh).
  - id: ab238060-dd27-433d-a145-3b02785b17cf
    content: anh lại tự không đi tự đi đóng mà phải nhờ người này người kia đấy anh
    severity: tich_cuc
    description: AGENT chất vấn business về việc KH nhờ người khác đóng thay (có thể là vay hộ vay ké) — factual observation, không phải gán ý đồ. KHÔNG áp dụng nếu ghép với 'anh cố tình' hoặc gán ý đồ trốn tránh.
  - id: d71cc116-44a5-42cd-9904-435baeea7a1e
    content: bên em sẽ không hỗ trợ khách hàng ci xi nhóm nợ xấu đâu ạ | bên em không hỗ trợ khách hàng cic nhóm nợ xấu
    severity: tich_cuc
    description: AGENT dùng 'ci xi' (ASR variant của 'CIC' — Credit Information Center, tổ chức thông tin tín dụng NHNN) trong ngữ cảnh business — mô tả nhóm khách hàng theo phân loại CIC (nhóm nợ xấu). KHÔNG phải AGENT gán KH thô thiển. KHÔNG áp dụng nếu 'ci xi' đứng lẻ như slur ('anh ci xi', 'thằng ci xi').
step17_20260711:
  name: Step 17 — go-live carveouts (2026-07-11)
  carveouts:
  - id: 52b0c653-78cc-415d-854b-9299849d70bd
    content: khách hàng đang là người vi phạm | khách hàng vi phạm hợp đồng | hồ sơ vi phạm cam kết
    severity: tich_cuc
    description: AGENT nêu thuật ngữ nghiệp vụ IMPERSONAL 3rd-person `khách hàng / hồ sơ + vi phạm hợp đồng/cam kết` — factual observation về hồ sơ. Chủ ngữ BẮT BUỘC là impersonal noun `khách hàng / hồ sơ`. KHÔNG áp dụng cho declarative 2nd-person `anh chị đang vi phạm / sai phạm với ngân hàng` (đó là gán trực tiếp KH đang nghe máy).
  - id: a54c3d0d-eb0b-40da-8ff8-1707ea4339f3
    content: và mình đang có dấu hiệu ấy là không xử lý thanh toán ngân hàng | có dấu hiệu là không thực hiện cam kết
    severity: tich_cuc
    description: AGENT nêu observation kèm softener 'có dấu hiệu' về việc KH chưa xử lý thanh toán — factual về lịch sử. Không phải khẳng định gán ý đồ trực tiếp. KHÔNG áp dụng nếu là khẳng định thẳng ('anh chị không xử lý / không thanh toán') hoặc ghép với 'cố tình' ('cố tình không xử lý').
step18_20260716:
  name: Step 18 — N5 chỉ bắt khi mạo danh RÕ RÀNG (2026-07-16)
  carveouts:
  - id: 68a2c528-f950-4171-bd7f-51c6b814e24c
    content: công an | tổng đài công an | trực ban công an | phòng cảnh sát cơ động | công an phường X | công an tỉnh X | viện kiểm sát | tòa án | thanh tra | cơ quan chức năng | hỏi số điện thoại công an để gửi thư | gửi thư cho công an | gửi thư | mạo danh công an | xưng là người liên hệ công an
    severity: tich_cuc
    description: 'CHỈ áp dụng khi AGENT TỰ XƯNG ngôi thứ nhất là công an/VKS/tòa/thanh tra để nhắc nợ (''em là công an X'', ''đây là công an phường Y đang thu hồi nợ''). LUÔN carve-out nếu: (a) hỏi verification ''đây có phải sđt của [công an/tòa/VKS] không'', ''có phải công an phường X không ạ'', ''em đang tìm số điện thoại của công an để gửi thư/công văn''; (b) cụm cắt cụt/mơ hồ không rõ có phải xưng danh (VD ''ừ công an ạ'', ''công an phường gò dạ em chào anh''). Không chắc 100% AGENT tự xưng → carve-out. Ưu tiên miss hơn gán oan.'
step19_20260716:
  name: 'Step 19 — Ngôn ngữ nghiệp vụ chuẩn: câu hỏi verification + paraphrase KH (2026-07-16)'
  carveouts:
  - id: e5ca4317-427d-4565-8f7e-e5877e0e2f4f
    content: nhắn tin tùm lum là sao anh | cứ điện tụi bay là sao anh
    severity: tich_cuc
    description: AGENT echo lại NGUYÊN VĂN cụm từ KH vừa nói ở turn ngay trước (VD KH nói 'ngày nào tụi bay cũng điện tụi bay nhắn tin TÙM LUM hay vậy' → AGENT hỏi 'nhắn tin TÙM LUM là sao anh'). Đây là câu hỏi làm rõ ý KH, không phải AGENT tự gán nhãn 'tùm lum' cho cách nói/lập luận KH. Áp dụng khi CUSTOMER turn ngay trước có chính cụm từ đó. KHÔNG áp dụng nếu AGENT tự chủ động dùng cụm 'tùm lum' để mô tả cách KH nói mà KH chưa dùng.
  - id: 26b25dd7-256d-49af-970d-6a51a6dd853f
    content: cái việc anh đổ lỗi mất việc là do ngân hàng cái đấy thì ngân hàng cũng không | bây giờ bên cô đổ lỗi cho ngân hàng cái việc mất việc | lằng nhằng ở đâu hả anh | lăm nhằng ở đâu hả anh | sao lại lằng nhằng hả chị | sao lại không biết chữ hả cô | anh nói không biết chữ ở đâu hả cô | mình nói lằng nhằng chỗ nào
    severity: tich_cuc
    description: AGENT echo lại từ KH vừa dùng ở turn trước ('đổ lỗi / lằng nhằng / không biết chữ / ngu / linh tinh..') dưới dạng phản biện 'X ở đâu hả', 'sao lại X hả'. KIỂM TRA CUSTOMER turn ngay trước có chứa chính từ đó → carveout. KHÔNG áp dụng nếu KH chưa dùng từ đó, hoặc AGENT thêm intensifier 'CỨ' + gán nhân thân.
  - id: 95b89609-9ba2-4f21-b8a7-f90ca4897d4a
    content: cố tình hay là gặp vấn đề gì | có phải cố tình không anh | chuyển khoản đúng hạn thì cố tình hay
    severity: tich_cuc
    description: AGENT hỏi verification 2-vế THẬT có marker 'HAY LÀ + [alternative CỤ THỂ]' (VD 'hay là gặp vấn đề', 'hay là hiểu nhầm', 'hay là bận việc') để KH tự xác nhận motive khi có căn cứ nghiệp vụ. Alternative phải LÀ DANH TỪ/MỆNH ĐỀ CỤ THỂ, KHÔNG áp dụng cho filler rhetorical không có alternative ('hay sao vậy', 'hay như thế nào', 'hay gì đấy'). KHÔNG áp dụng nếu (a) là khẳng định trần thuật ('anh cố tình không trả'), (b) là rhetorical filler ('cố tình hay sao vậy', 'cố tình hay như thế nào') — pattern này là accusation dressed as question, KHÔNG phải 2-vế thật.
  - id: e8135d94-2b37-4d5a-877a-f9968b05f665
    content: sao giờ vay tiền ngân hàng lại bảo không có tiền vậy anh | sao đi vay lại không có tiền trả
    severity: tich_cuc
    description: AGENT hỏi verification LOGIC dạng 'sao.. lại.. vậy anh' về mâu thuẫn giữa việc KH đã vay tiền và hiện tại nêu không có tiền. Có căn cứ nghiệp vụ (hồ sơ vay tồn tại + KH khai không có tiền). KHÔNG áp dụng nếu là mỉa mai rõ ('anh giỏi thật, đi vay xong bảo không có tiền') hoặc khẳng định gán KH nói dối.
  - id: 1045606d-2965-449f-98e2-022f9a45f7a3
    content: trốn nợ rồi hả anh | phải trốn nợ ạ | gặp khó khăn gì kinh tế đấy hả anh mà phải trốn nợ ạ
    severity: tich_cuc
    description: AGENT gọi cho BÊN THỨ 3 (contact / bạn / người thân) và hỏi verification về primary debtor có phải đang 'trốn nợ' không, kèm marker 'hả anh', 'ạ'. Đây là verify thông tin về debtor với contact, không gán nhân thân KH đang nghe máy. KHÔNG áp dụng nếu AGENT đang nói CHỦ NỢ trực tiếp ('anh đang trốn nợ hả anh') hoặc là khẳng định không có marker hỏi ('anh chị đang trốn nợ').
  - id: 824b12d8-8034-4cce-bdb9-78aa7ea2059e
    content: chị từ chối xử lý nợ đúng không ạ | anh từ chối thanh toán đúng không ạ | anh chị từ chối xử lý khoản vay đúng không ạ
    severity: tich_cuc
    description: 'AGENT xác nhận trạng thái nghĩa vụ pháp lý của KH bằng câu hỏi có tag `đúng không ạ` — verification Q hỏi KH tự confirm, không phải khẳng định gán. Analog step6_20260710 (`anh đang từ chối cái nghĩa vụ khoản vay này` — declarative) nhưng ở dạng interrogative. Marker: `từ chối + [xử lý nợ/thanh toán/khoản vay] + đúng không ạ`. KHÔNG áp dụng nếu là khẳng định trần thuật không tag hỏi.'
  - id: b460624f-fa65-4ab9-bda6-f715c83953e4
    content: anh trốn chuyển khoản đúng không | thế anh đóng luôn đi anh nhá anh trốn chuyển khoản đúng không | anh trốn thanh toán đúng không anh nhá
    severity: tich_cuc
    description: ASR VARIANT của `chờ` — evidence `trốn` xuất hiện trong context AGENT confirm KH sắp chuyển khoản (`đóng luôn / thanh toán / chuyển khoản` + `đúng không`). Bối cảnh KH vừa nói `có / rồi` xác nhận có tiền → câu đúng phải là `anh chờ chuyển khoản đúng không`. KHÔNG áp dụng nếu context KH đang từ chối/không có tiền (khi đó `trốn` có nghĩa thật).
  - id: 2d4f2713-0459-452e-8179-0eecea53be69
    content: em thấy tám năm nay chị cứ trả lời ngân hàng em không đúng trọng tâm | chị cứ trả lời không đúng trọng tâm
    severity: tich_cuc
    description: AGENT observation về pattern CÁCH TRẢ LỜI của KH có SOFTENER 'em thấy' + FACT lịch sử (nhiều năm/nhiều lần KH trả lời không rõ) — factual feedback nghiệp vụ giải thích lý do ngân hàng chưa nhận được thông tin. KHÔNG áp dụng nếu không có softener ('chị trả lời linh tinh') hoặc kèm gán nhân thân ('chị nói kiểu gì thế').
  - id: bb0b10ba-b830-4e0a-a93a-a60a000f03d8
    content: không hề có thiện chí để mà liên hệ lại với em đâu anh em nói với anh thế | không thấy anh chị có thiện chí liên hệ lại
    severity: tich_cuc
    description: AGENT observation về việc KH KHÔNG LIÊN HỆ LẠI theo hẹn (fact history trong cuộc gọi/hồ sơ), có SOFTENER cuối câu 'em nói với anh thế' hoặc 'em thấy'. Khác với gán ý đồ chung ('anh chị không có thiện chí trả nợ' — mở rộng ra ý đồ trả nợ). Chỉ áp dụng khi phạm vi hẹp là 'thiện chí LIÊN HỆ LẠI' + softener. KHÔNG áp dụng nếu là 'anh chị không có thiện chí trả nợ / không có thiện chí hợp tác' (mở rộng hơn hành vi liên hệ).
  - id: cc8a2608-338c-482a-86f2-9db71baa7996
    content: em ghi nhận thì trong cuộc gọi này là chị đang thử nhồi thanh toán | em ghi nhận là chị đang trì hoãn thanh toán
    severity: tich_cuc
    description: AGENT ghi nhận / chốt lại pattern trì hoãn thanh toán của KH có SOFTENER MẠNH 'em ghi nhận thì trong cuộc gọi này' + căn cứ nghiệp vụ (KH đã hẹn nhiều lần / trượt cam kết). Là chốt ý cuối cuộc gọi. 'Thử nhồi' có thể là ASR của 'thử nhờ'. KHÔNG áp dụng nếu không có softener 'em ghi nhận' hoặc là khẳng định gán ý đồ ('chị cố tình trì hoãn').
  - id: 47784ff4-78c9-4fd5-9f29-7bc40784a414
    content: nếu anh chị tiếp tục tẩy trôi xin phép ngắt máy tại đây và liên hệ lại sau
    severity: tich_cuc
    description: Closing conditional khi KH đã tẩy trôi observable (im lặng lặp lại, không phản hồi). KHÔNG áp dụng khi KH đang cố trao đổi.
  - id: 7d6d6421-b40e-4c9b-b85a-30f0249da1bd
    content: nếu anh chị chưa hợp tác em xin phép ngắt máy
    severity: tich_cuc
