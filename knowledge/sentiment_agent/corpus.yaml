    content: nếu mà trong cuộc gọi này mình báo mình không nghe thấy gì hết mà mình vẫn phản hồi thông tin được như vậy thì em đang nhận xét rằng là mình đang không muốn hỗ trợ trao đổi trong cuộc gọi này em xin phép ngắt máy và gọi lại trao đổi sau em chào chị
    severity: tich_cuc
    description: AGENT observation về contradiction (KH claim `không nghe` nhưng vẫn `phản hồi được`) với softener `em đang nhận xét rằng` + closing template `xin phép ngắt máy và gọi lại trao đổi sau`. Factual paraphrase KH's contradiction + business closing. KHÔNG áp dụng nếu KH thực sự không nghe được (audio issue rõ trong context).
  - id: 3d79a922-ed5c-4d82-af1b-55210024f18d
    content: cô nếu như mà cô vẫn không tập trung vào cái vấn đề này cháu xin phép ngắt máy nhá cuộc gọi kéo dài rồi đấy ạ
    severity: tich_cuc
    description: 'AGENT closing conditional với formal address `cô/cháu` (không phải `anh/chị`) + softener `nhá + ạ` + factual `cuộc gọi kéo dài` sau khi KH chửi bậy `chúng mày ngân hàng đéo gì` ≥2 lượt. AGENT giữ respectful mid-escalation. KHÁC positive (đóng khi KH mới bức xúc nhẹ). Đặc trưng: AGENT dùng `cô/cháu` formal + KH đã chửi/xưng `mày` ≥2 lượt.'
  - id: b66065bf-ead3-43d1-89c5-8178149a2a56
    content: còn trong hôm nay mà sáng nay mà không có phương án giải quyết thì bên em sẽ liên hệ lại bên phía công an tỉnh tại vì để báo cáo lại thì bên em cũng đã làm việc mấy đợt rồi
    severity: tich_cuc
    description: AGENT escalation warning `sẽ liên hệ công an tỉnh báo cáo lại` với căn cứ nghiệp vụ rõ `bên em cũng đã làm việc mấy đợt rồi` (repeat delinquency history) + conditional softener `còn trong hôm nay mà.. nếu không có phương án`. AGENT KHÔNG xưng danh là công an (khác ). KHÔNG áp dụng nếu (a) AGENT xưng danh là công an, (b) không có history nhiều đợt collect trong context, (c) threat cho debt mới không phải repeat.
  - id: 6a31dcf7-8b27-400c-adba-c0b29d7fa757
    content: à thế thì anh ơi thế thì em xác nhận anh từ chối thanh toán theo cam kết của bên ngân hàng đưa ra cho khoản vay hôm nay nhá
    severity: tich_cuc
    description: AGENT ghi nhận `từ chối thanh toán` với scope hẹp `theo cam kết ngân hàng đưa ra cho khoản vay hôm nay` sau khi KH không commit được `hôm nay` (KH nói `đi vay chỗ khác chưa thấy trả lời`). Procedural per-day recording, softener `à thế thì anh ơi` + `nhá`. Variant scope-narrower case 2 batch 1. KHÔNG áp dụng nếu KH đã đưa phương án cụ thể trong ngày.
  - id: d165170a-bbce-43be-a956-9edc1e4235b5
    content: thì em báo là anh từ chối thanh toán trong ngày hôm nay mà anh
    severity: tich_cuc
    description: AGENT reassert `từ chối thanh toán trong ngày hôm nay` khi KH deny nhưng không commit được ngày cụ thể (KH nói `em vay được thì em sẽ đóng` - conditional không rõ ngày). Softener `mà anh` + scope `trong ngày hôm nay`. Procedural. KHÔNG áp dụng nếu KH đã commit thời điểm cụ thể trong ngày.
  - id: 35665090-b91a-45b0-8ab1-b3ee17b055f5
    content: em thấy trong cuộc gọi này mình đang không trao đổi được bên phía ngân hàng lịch sự lại được thì em xin phép kết thúc cuộc gọi nhờ chị về trao đổi lại với anh giúp em nhá em chào chị kết thúc
    severity: tich_cuc
    description: 'AGENT closing với DOUBLE SOFTENER `em thấy` đầu + `giúp em nhá + em chào chị kết thúc` cuối + polite escalate-to-family `nhờ chị về trao đổi lại với anh (chồng)` sau khi KH complaint nợ nhiều nơi/không có phương án ≥2 lượt. Đặc trưng: có escalate-to-family + KH đã complain difficulty ≥2 lượt. KHÁC positive (đóng khi KH bức xúc nhẹ, không escalate-to-family).'
  - id: ec5b889b-e3a0-4dcd-a5d2-f5b8d77eddbf
    content: em hỏi mà toàn thể chỉ hỏi ngược lại thôi
    severity: tich_cuc
    description: AGENT factual observation về KH liên tục hỏi ngược thay vì trả lời trực tiếp câu hỏi verify (KH liên tục `có gì hông`, `đang thanh toán là sao vậy`, `nó bị cái gì`). Business feedback ngắn. KHÔNG áp dụng nếu KH đã trả lời trực tiếp hoặc kèm gán label (`nói lung tung, nói vớ vẩn`).
  - id: 63cf2cfb-0d17-4e81-a4b3-821e243dc4ed
    content: nếu anh không bình tĩnh lịch sự trao đổi không đưa máy cho chị khi chủ hợp đồng làm việc với ngân hàng được thì em xin phép ngắt máy nhá cán bộ khác bên win sẽ liên hệ lại ạ
    severity: tich_cuc
    description: AGENT closing conditional với softener `nhá + ạ` + escalation info `cán bộ khác sẽ liên hệ lại` sau khi KH đã chửi tục NẶNG `địt mẹ mày / mày kèm động từ` ≥1 lượt HOẶC chửi nhẹ liên tục ≥3 lượt. Self-defense close khi KH verbal abuse. THẮNG P pattern (`không bình tĩnh + ngắt máy` khi KH mới bức xúc) vì severity level KH đã escalate. KHÔNG áp dụng nếu KH chưa chửi bậy hoặc chỉ bức xúc nhẹ.
  - id: 58d97563-7ae3-473f-9878-02813cc93daf
    content: vâng thế thì bên em sẽ ghi nhận là chị nguyễn thị hồng trang đang từ chối thanh toán khoản nợ ở ngân hàng việt nam thịnh vượng win chị nhá mình đang không có phương án xử lý nợ cho ngân hàng
    severity: tich_cuc
    description: AGENT ghi nhận `từ chối thanh toán khoản nợ` với scope tổng + softener `vâng thế thì` + `chị nhá` sau khi KH nói `không có khả năng tất toán` (muốn chia nhỏ nhưng không được hỗ trợ). Procedural per-call recording. KHÔNG áp dụng nếu KH đã đưa phương án cụ thể được bank chấp nhận.
  - id: f938844a-e4c4-4fb3-bd1d-38aa8298a180
    content: không yêu lắm
    severity: tich_cuc
    description: Fragment `không yêu lắm` có khả năng cao là ASR error từ `không nghe (rõ) lắm` khi KH chửi `đéo nghe` ×3. Turn AGENT ngay sau là `nếu không cần hỗ trợ thì em xin phép ngắt máy đấy ạ` — polite close consistent với `không nghe rõ`, không consistent với mỉa mai. Standalone 3-từ fragment ASR-mangled → suppress.
  - id: 085b14ec-651e-4d84-8ea0-bae11557f07a
    content: vâng đúng rồi thì em đang ghi nhận là anh không trả lời câu hỏi ngân hàng thì ngân hàng mặc định mà anh
    severity: tich_cuc
    description: AGENT ghi nhận procedural inference `không trả lời = ngân hàng mặc định` với softener `vâng đúng rồi + em đang ghi nhận + mà anh` sau khi KH không answer câu hỏi kế hoạch trả nợ. Business logic recording. KHÔNG áp dụng nếu KH đã trả lời rõ về kế hoạch.
  - id: 4b52ad54-09ee-44ef-88fd-04821cf114c0
    content: à nhưng mà sao anh lại phải trốn vậy anh
    severity: tich_cuc
    description: AGENT verify Q về debtor (anh Duy) có phải trốn nợ không, hỏi với BT3 (anh trai debtor). Softener `à nhưng mà`, `vậy anh`. Extension của pattern. KH turn trước đã tự nói debtor `mất tiêu, đi mất tiêu rồi`. KHÔNG áp dụng nếu là gọi trực tiếp debtor primary (`anh đang trốn hả anh`).
  - id: ee4c874c-1a5b-4fba-adf8-aa4c41ed0830
    content: nãy giờ em hỏi anh không trả lời đúng trọng tâm gì hết anh
    severity: tich_cuc
    description: AGENT factual observation về KH off-topic ≥3 turns liên tục (KH nói `để em lên chi nhánh làm việc` thay vì answer câu hỏi thu nhập). Softener `nãy giờ + anh`. Không có intensifier `CỨ / lại`. KHÔNG áp dụng nếu KH đã trả lời trực tiếp hoặc kèm gán label (`nói lung tung`).
  - id: 4b076b0a-d9bc-477b-a280-a186d24858de
    content: nếu hỏi thu nhập anh không trả lời anh trả lời sang vấn đề khác em anh hỏi xác nhận lại giúp giùm em thông tin
    severity: tich_cuc
    description: AGENT conditional feedback về off-topic với softener `giúp giùm em thông tin` + request KH confirm lại. Business follow-up. KHÔNG áp dụng nếu KH đã trả lời trực tiếp.
  - id: e05ff9e3-0b80-427e-9cc7-47f06cc70ef8
    content: vậy để tránh việc phải tham gia tố tụng tại tòa anh vui lòng thanh toán hết toàn bộ dư nợ anh chưa trao đổi được đúng trọng tâm trong cuộc gọi thì em xin phép kết thúc cuộc gọi sẽ có cán bộ khác liên hệ ra cho anh sau em chào anh
    severity: tich_cuc
    description: AGENT closing với softener `vui lòng thanh toán` + factual `chưa trao đổi được đúng trọng tâm` + escalation `cán bộ khác liên hệ ra sau` + `em chào anh` sau khi KH consistent off-topic ≥3 turns. Standard polite closing khi non-productive call. KHÔNG áp dụng nếu KH đang cố trao đổi tốt.
  - id: 386a2270-e633-4a66-ad17-042663295024
    content: kinh doanh tự do như anh thì xoay sở mấy chục triệu nó cũng khó lắm đâu anh
    severity: tich_cuc
    description: AGENT reasoning về khả năng tài chính dựa trên nghề (kinh doanh tự do) + factual context (bank giải ngân khoản tiểu thương >200tr → có nguồn thu chứng minh). Softener `đâu anh`. Business argument for payment capacity. KHÔNG áp dụng nếu không có căn cứ nghề nghiệp/khoản vay cụ thể trong context.
  - id: ecca3b2c-530c-4fef-a7d1-334ca3f451e0
    content: ờ thì sao bây giờ anh không chạy luôn đi anh
    severity: tich_cuc
    description: AGENT informal push follow-up khi KH nói `phải ráng chạy mượn bạn bè` — hỏi tại sao không thực hiện ngay. Softener `ờ thì sao + đi anh` cuối câu. Business Q về timeline. KHÔNG áp dụng nếu kèm mỉa mai explicit (`giỏi thật đấy đi chạy`) hoặc dồn ép nhiều lần lặp (≥3 lần trong ca ngắn).
  - id: c7a21eae-ec3e-4fa6-84b5-2f526c8c7722
    content: em nói là anh từ chối thanh toán theo đúng kế hoạch ngân hàng đưa ra là ngày hôm nay vì em vừa mới xác nhận là anh không thanh toán được ngày hôm nay ạ
    severity: tich_cuc
    description: AGENT clarify với justification `vì em vừa mới xác nhận anh không thanh toán được ngày hôm nay` — procedural scope hẹp `theo kế hoạch ngân hàng ngày hôm nay` với softener `ạ`. Có căn cứ verify trước đó. KHÔNG áp dụng nếu KH đã đưa phương án cụ thể trong ngày.
  - id: 0efa67b4-cf60-4efa-864c-2dc3a06369ca
    content: thế tức là cả hai vợ chồng anh đang thất nghiệp vài năm thế thì chi tiêu ăn uống hàng ngày rồi cả cái tiền mà đi chữa trị là anh lấy từ đâu hả anh
    severity: tich_cuc
    description: AGENT verify hardship credibility bằng câu hỏi mở về nguồn tiền chi tiêu — factual Q khi KH claim thất nghiệp nhiều năm + chi tiêu bao gồm chữa trị (nhu cầu cao). Softener `hả anh` cuối câu. Business verification. KHÁC case labeler noise (case 9 batch 1 tunn31) — pattern đó có so sánh hạ thấp `một nhân viên đi làm bình thường cũng có tiền dư`. KHÔNG áp dụng nếu kèm so sánh hạ thấp explicit hoặc gán label lối sống (`chơi bời, ăn chơi`).
  - id: 950b04e6-acee-4fef-8f6b-7d3163f35eb0
    content: chưa có thì anh phải đưa ra bằng chứng khó khăn để bên ngân hàng còn hỗ trợ chứ anh anh cứ bảo là anh ốm ốm thì ai cũng ốm ốm người ta chỉ ốm hai ba ngày người ta khỏi người ta lại đi làm anh ạ anh đâu phải bệnh tật gì đến mức là không đi làm được đâu anh
    severity: tich_cuc
    description: AGENT push KH đưa bằng chứng hardship + factual assertion về mức độ ốm bình thường (2-3 ngày khỏi lại đi làm) khi KH claim ốm mà không có bằng chứng cụ thể (giấy tờ y tế). Softener `anh ạ + đâu anh` cuối. Business push for evidence. KHÔNG áp dụng nếu KH đã đưa bằng chứng bệnh cụ thể (giấy chứng nhận, viện phí) hoặc kèm gán nhân thân (`anh lười / anh giả bệnh`).
  - id: 62588776-f15d-42ac-8acf-139f36321502
    content: anh lại không trao đổi đúng trọng tâm câu hỏi
    severity: tich_cuc
    description: AGENT factual restatement `anh lại không trọng tâm` sau khi turn AGENT trước (cùng cuộc gọi) đã có version có softener (VD `anh vui lòng trao đổi đúng trọng tâm giúp em nhá`) và KH tiếp tục off-topic. Intensifier `lại` = KH lặp lại pattern off-topic. Business factual. KHÔNG áp dụng nếu (a) là turn AGENT đầu tiên (chưa có version softener trước), (b) KH không factually off-topic, (c) kèm gán label thô (`nói linh tinh / vớ vẩn`).
  - id: 07f802ab-2217-4f6f-b239-3fd488472f8f
    content: nếu mà anh hiểu nếu mà anh hiểu ở đây á thì anh thấy là anh sai cái gì ở đây
    severity: tich_cuc
    description: AGENT Socratic challenge Q với softener conditional `nếu mà anh hiểu` + subjective `anh thấy là` khi KH claim understand (`tôi không phải không hiểu cái gì đâu`) nhưng vẫn demand bank support (giảm lãi/gia hạn). Ask KH to identify what they see as the issue/mistake. Business dialectic. KHÔNG áp dụng nếu (a) KH không claim understand trước đó, (b) kèm mỉa mai explicit (`anh giỏi thế mà không hiểu à`).
  - id: 2f490446-4e5a-4327-bee4-95ca3ff483aa
    content: cháu xin lỗi cô nhá nếu cô không có muốn phía bên ngân hàng liên hệ lại thì cô thu xếp thanh toán giúp cháu bởi vì bên ngân hàng có liên hệ ngày mười một cô cũng có cam kết thanh toán nhưng cô đều thất hứa quá ạ
    severity: tich_cuc
    description: AGENT formal `cháu/cô` (respectful younger-to-elder) + apology `xin lỗi cô nhá` + factual observation `cô đều thất hứa quá ạ` với căn cứ cụ thể (ngày 11 cam kết thanh toán) + softener `quá ạ` cuối. Polite factual về repeat commitment breaking. KHÔNG áp dụng nếu thiếu formal address hoặc không có căn cứ cam kết cụ thể trong context.
step46_20260805_manual_fn_batch1:
  name: Step46 20260805 Manual Fn Batch1
  positives:
  - id: b3116a98-cec0-4ac5-9c38-eb2efdc4ca24
    content: nếu như mà ngay từ đầu anh không quen thì anh nói luôn là anh không quen để em hỗ trợ sai số nhầm số tránh mất thời gian
    severity: warning
    description: AGENT dạy đời cách KH nên phản hồi khi KH che đậy danh tính người Khác — cấu trúc 'nếu ngay từ đầu.. anh phải nói luôn.. tránh mất thời gian'. dạy đời kết hợp gán ý đồ mất thời gian cho KH.
  - id: 7d9a7210-1695-4266-aed3-0a9eb1858189
    content: trao đổi bình tĩnh lịch sự được không anh | anh có trao đổi lịch sự được không ạ | mình trao đổi lịch sự lại được không anh
    severity: warning
    description: AGENT hỏi thẳng KH có trao đổi lịch sự được không — chất vấn thái độ KH. Bắt buộc có cụm 'lịch sự' + 'được không' và KHÔNG có softener. Vẫn bắt lỗi kể cả khi KH đã chửi tục nhiều lượt trước đó — việc KH chửi trước không gỡ tội cho câu hỏi này. Không áp dụng nếu câu có 'vui lòng' hoặc 'giúp em' ('anh vui lòng trao đổi lịch sự giúp em được không ạ') hoặc là closing conditional ('nếu không trao đổi lịch sự thì em xin phép ngắt máy').
  - id: 3f4fd514-9c50-4127-8a9f-dca09b26961a
    content: nếu mà anh bất lịch sự thì em xin phép ngắt máy | trường hợp anh chị bất lịch sự bên em xin phép ngắt máy | mình trao đổi bất lịch sự thì em xin phép ngắt máy
    severity: warning
    description: AGENT dùng label 'bất lịch sự' cho cách nói của KH, kể cả trong nếu-thì template kèm ngắt máy. 'bất lịch sự' là nhãn nặng hơn 'chưa/không lịch sự'. Không áp dụng cho 'chưa lịch sự / không lịch sự' trong closing template.
  - id: 37cd6438-bea8-482b-86e3-bf87913df727
    content: chị luôn luôn đổ lỗi cho bên phía ngân hàng
    severity: warning
    description: AGENT dùng 'LUÔN LUÔN đổ lỗi cho ngân hàng' — gán nhãn hành vi lặp lại tiêu cực cho KH bằng trạng từ tuyệt đối. gán nhãn cách lập luận.
  - id: 6563d482-3ba3-44f7-88f2-c06c32ac9d95
    content: chị không nghe thấy sao chị trả lời được ạ
    severity: warning
    description: AGENT dùng câu hỏi tu từ 'không nghe thấy SAO trả lời được' để mỉa mai, châm chọc phản ứng của KH. mỉa mai qua câu hỏi tu từ chế giễu.
  - id: 21466164-89f9-47c8-be2c-4917e3a375a8
    content: chả có ai mà bị đòi nợ nhiều mà mất được đâu
    severity: warning
    description: AGENT phản bác lý do KH nêu về việc người thân đã mất ('chả có ai bị đòi nợ nhiều mà mất được') — chối bỏ, mỉa mai lời than của KH về hoàn cảnh mất mát. mỉa mai.
  carveouts:
  - id: 17e7654c-23b1-44e8-ac74-f1490c3e3cc9
    content: Em thấy mình không tập trung trao đổi em xin phép ngắt máy gọi lại
    severity: tich_cuc
    description: AGENT ép KH tập trung bằng mệnh lệnh ('anh phải tập trung ngay', 'anh nghiêm túc đi'). Không áp dụng cho câu reflect + closing lịch sự ('anh ơi anh tập trung trao đổi ngân hàng xin phép ngắt máy gọi sau nhá', 'thấy mình chưa tập trung nên ngân hàng xin phép ngắt'), đây là điều hướng nghiệp vụ và QC không bắt lỗi.
  - id: 04be26c5-e242-4e51-84a1-d8f80ef02cd9
    content: một mực anh cho rằng
    severity: tich_cuc
    description: Cụm này cần xem phần câu phía sau. Nếu “một mực anh cho rằng” chỉ được dùng để thuật lại khách quan quan điểm của KH thì có thể Không vi phạm. Chỉ đánh Warning khi cách nói thể hiện sự khó chịu, phủ định hoặc phê phán việc KH giữ quan điểm.
  - id: 9ee54fab-b922-4cbd-aad9-6cee250f36f0
    content: anh không muốn ngân hàng gọi điện để em phải thanh toán
    severity: tich_cuc
    description: Ngôn ngữ trong THN
  - id: 1dc75a7d-83fb-4ec2-99dc-7d7b1d31993c
    content: giữ được bình tĩnh để trao đổi không chị | anh có giữ được bình tĩnh trao đổi không | anh có bình tĩnh được không | anh chị bình tĩnh trao đổi được không | sao mình có giữ được bình tĩnh để trao đổi | mình bình tĩnh giúp em được không chị | nếu chị chưa bình tĩnh trao đổi được thì em xin phép ngắt máy | mình chưa sẵn sàng trao đổi thì em xin phép ngắt máy liên hệ lại sau | chị trao đổi bình tĩnh đi chị nhá | anh trao đổi bình tĩnh đi anh
    severity: tich_cuc
    description: AGENT hỏi/điều hướng KH bình tĩnh hoặc thông báo ngắt máy khi KH chưa bình tĩnh. Theo QC không bắt lỗi với toàn bộ nhóm từ 'bình tĩnh', kể cả dạng câu hỏi, mệnh lệnh có softener ('đi ạ', 'đi chị nhá'), hay câu chào kết thúc. Không áp dụng nếu câu có kèm cụm 'lịch sự được không' ('trao đổi bình tĩnh lịch sự được không anh') — đó là chất vấn thái độ, vẫn bắt lỗi.
  - id: 2fa363d8-a31f-455f-8497-a807b64c8059
    content: nếu như anh không trao đổi lịch sự thì em xin phép ngắt máy | nếu mình không trao đổi được lịch sự bên em xin phép ngắt máy | mình trao đổi chưa lịch sự bên em xin phép ngắt máy | trao đổi không lịch sự ngân hàng xin phép ngắt máy liên hệ lại sau | mình trao đổi thiếu lịch sự bên em xin phép ngắt máy trước ạ | không thể trao đổi lịch sự ngân hàng xin phép ngắt máy | em thấy là mình trao đổi đang không lịch sự em xin phép ngắt máy | anh trao đổi lịch sự giúp em nhá còn nếu như mình không trao đổi lịch sự thì em xin phép dừng cuộc gọi | nếu mà mình chưa có nghiêm túc hợp tác trao đổi bên phía ngân hàng xin phép ngắt máy | mình chưa sẵn sàng trao đổi ngân hàng xin phép ngắt máy sẽ liên hệ lại sau
    severity: tich_cuc
    description: AGENT closing template dùng 'không/chưa/thiếu lịch sự' + softener 'nếu... thì' + 'ngân hàng liên hệ lại sau'. Là phản ánh trạng thái + đề nghị dừng, không phải chất vấn KH. Không áp dụng cho nhãn nặng 'bất lịch sự' hoặc câu hỏi trực tiếp phán xét ('anh có trao đổi lịch sự được không').
  - id: 4ca0863c-9c62-4b5c-8e96-1937d304d34e
    content: chị trao đổi đúng thông tin giúp em ạ | anh nói đúng sự thật giúp em | mình cung cấp đúng thông tin nhá | chị trao đổi đúng thông tin giúp em chị ơi | anh ơi mình vui lòng là trao đổi lịch sự giúp em ạ | nếu trong trường hợp sai số nhầm số thì mình cũng phải trao đổi lịch sự để bên phía ngân hàng còn hỗ trợ ạ
    severity: tich_cuc
    description: AGENT yêu cầu KH nói đúng sự thật/cung cấp đúng thông tin/trao đổi lịch sự có softener 'giúp em ạ / vui lòng / để còn hỗ trợ'. Là yêu cầu nghiệp vụ lịch sự, không phải áp đặt/phán xét. Không áp dụng nếu là cáo buộc thẳng ('anh đang lừa dối', 'anh cố tình khai sai').
  - id: 0b6dcd10-afe2-4114-b949-8e61911ad727
    content: em ghi nhận là anh chị đang từ chối thanh toán | em ghi nhận việc anh từ chối khoản nợ | ngân hàng ghi nhận là mình từ chối trao đổi
    severity: tich_cuc
    description: AGENT ghi nhận trạng thái KH từ chối thanh toán/khoản nợ, softener 'em ghi nhận / ngân hàng ghi nhận'. Là observation nghiệp vụ, không phải gán ý đồ. Không áp dụng nếu kèm đe dọa pháp lý ('đây sẽ là căn cứ để chống lại anh trước tòa') hoặc cáo buộc ('cố tình từ chối', 'ngân hàng không hỗ trợ đâu').
step47_20260805_manual_fn_batch2:
  name: Step47 20260805 Manual Fn Batch2
  positives:
  - id: 16a4c566-269c-4526-85da-229d7fae0fe6
    content: anh khống bao nịn bọn em là lợi dụng ngân hàng để lừa đảo
    severity: warning
    description: AGENT gán từ 'KHỐNG BÁNG / VU KHỐNG' (biến âm ASR 'khống bao nịn') cho lời phản ánh của KH — gán ý đồ vu cáo cho phát biểu của KH. gán ý đồ kết hợp từ pháp lý.
  - id: e150f7c5-ef00-41f6-b763-2745bb79a303
    content: khách hàng đang xử lý thì mình cũng không được trao đổi bất lịch
    severity: warning
    description: AGENT gán nhãn 'trao đổi BẤT LỊCH (SỰ)' cho KH NGAY LƯỢT ĐẦU cuộc gọi, khi KH chưa có tương tác gì. gán nhãn cách nói vô cớ. KHÁC với trường hợp AGENT nêu sau khi KH đã chửi tục nhiều lần.
  - id: c69c3989-3a02-4cb6-b6d3-40047deab341
    content: anh trao đổi luôn ngân hàng với thái độ như thế ạ
    severity: warning
    description: AGENT khẳng định 'anh trao đổi ngân hàng với THÁI ĐỘ như thế' — gán nhãn thái độ tiêu cực cho KH khi KH chỉ đang than phiền về lịch trình gọi/tiếp nhận thông tin. gán nhãn cách nói.
  - id: aba2fb8b-a2c9-4fe1-8881-60150c9238a6
    content: cố tình
    severity: warning
    description: AGENT dùng cụm 'CỐ TÌNH' đơn lẻ hoặc chèn giữa câu khi KH chỉ báo nhầm số / phủ nhận identity — gán ý đồ tiêu cực. gán ý đồ.
  - id: 99d2c690-7b7a-40d6-9559-55cc0adbc20c
    content: để cho đến ra tòa giải quyết thì nó cũng là cái sự bất thông minh
    severity: warning
    description: AGENT bình phẩm việc KH để nợ ra tòa là 'sự BẤT THÔNG MINH' — gán nhãn nhận thức tiêu cực cho quyết định của KH. dạy đời qua gán nhãn nhận thức.
  carveouts:
  - id: 4a8a262c-4e18-4a3f-96df-ff0ec3a8cb83
    content: hứa hẹn như vậy mãi không thanh toán được là không được đâu
    severity: tich_cuc
  - id: 4782afbe-158d-4e3c-ae0f-d33e14552a1f
    content: thế sao anh phải trao đổi những cái thông tin đấy để làm gì anh
    severity: tich_cuc
    description: AGENT dùng câu hỏi tu từ 'sao anh phải trao đổi những thông tin đấy để làm gì' — chế giễu ngược lại mục đích cuộc gọi. mỉa mai. Chỉ áp dụng khi KH chưa có behavior tiêu cực (chửi, chống đối) trước — nếu KH đã chửi CB thì câu này là nhắc KH tập trung, không phải mỉa mai.
  - id: 8b679a8f-25a0-4110-9349-51b200d6e6c7
    content: em nghĩ là trong giai đoạn đó anh biết rõ chứ sao lại không biết
    severity: tich_cuc
    description: AGENT dùng khẳng định 'em nghĩ/em thấy + biết rõ chứ + sao lại không biết' — bác bỏ lời KH và gán ý đồ giả vờ. Bắt buộc có marker khẳng định ('em nghĩ', 'em thấy', 'chứ'). Không áp dụng cho câu hỏi verify đơn thuần 'sao anh không biết' hoặc 'sao không biết mà lại biết' (chỉ chất vấn mâu thuẫn KH, không gán ý đồ).
  - id: 7f63792f-7306-4cc4-a3c9-e9b22c3efbfa
    content: đi làm suốt thế thì cũng có tiền chứ đúng không anh
    severity: tich_cuc
    description: AGENT chất vấn tài chính KH bằng suy luận 'đi làm suốt thì cũng phải có tiền' — câu hỏi tu từ áp lực về khả năng thanh toán. mỉa mai qua suy luận tài chính.
step48_20260805_manual_fn_batch3:
  name: Step48 20260805 Manual Fn Batch3
  positives:
  - id: 71208867-4100-433b-92b9-31d32fe9d64f
    content: tôi thấy mình trao đổi rất là bất lịch sự ngân hàng xin phép ngắt máy
    severity: warning
    description: AGENT dùng 'TÔI thấy mình trao đổi RẤT LÀ BẤT LỊCH SỰ' — label mạnh với modifier 'rất' + xưng 'tôi' thay vì 'em'. gán nhãn cách nói với modifier tăng cường.
  - id: be2db0ee-ad4d-4104-989f-a7597b4c76ea
    content: anh thừa hiểu là chủ nhật thì không đi làm cắt làm sao được
    severity: warning
    description: AGENT dùng cụm 'anh THỪA HIỂU là..' để mỉa mai nhận thức của KH khi KH đưa lịch hẹn. mỉa mai qua động từ 'thừa hiểu' hàm ý KH đang giả vờ không hiểu.
  carveouts:
  - id: 9d040db5-28fc-4d36-90c1-ba7518ce72ee
    content: trong cuộc gọi này thì em thấy là mình trao đổi đang không lịch sự ý ạ em xin phép ngắt máy
    severity: tich_cuc
    description: 'AGENT dùng cụm ''trao đổi KHÔNG LỊCH SỰ'' để đánh giá thẳng cách nói của KH kèm ngắt máy. Theo QC: cụm ''không lịch sự / bất lịch sự'' là đánh giá trực tiếp KH, dễ gây khiếu nại. gán nhãn cách nói. KHÔNG apply cho closing khi KH đã chửi tục thô tục nặng.'
  - id: bfa6399d-74ba-4e03-91a7-380a23daa72a
    content: cô cũng lớn tuổi rồi mà bên cháu ngày nào cũng gọi ra số này cho cô cũng rất là phiền nên là cô cũng báo anh ý là bây giờ cũng sinh năm tám tư rồi thì chủ động xử lý nợ cho ngân hàng đi
    severity: tich_cuc
    description: AGENT so sánh tuổi tác ('lớn tuổi rồi mà', 'sinh năm tám tư rồi') để gây áp lực cho người thân KH phải chủ động trả nợ. dạy đời qua so sánh tuổi tác.
  - id: e8de2e04-c05d-4d10-9824-ca729c823dc9
    content: cứ cố tình
    severity: tich_cuc
    description: AGENT dùng cụm 'CỨ CỐ TÌNH' đơn lẻ để gán ý đồ ngoan cố cho KH khi KH chỉ báo nhầm số hoặc mới mua SIM. gán ý đồ; mạnh hơn 'cố tình' đơn lẻ nhờ trạng từ 'cứ' nhấn tính lặp lại.
  - id: 18b84809-7e88-40f3-bbd8-a71ea209c674
    content: mình trao đổi nghiêm túc được
    severity: tich_cuc
    description: 'AGENT đặt CÂU HỎI ''mình trao đổi nghiêm túc được (không)''. Theo QC: chỉ được nói statement ''nếu không nghiêm túc em xin phép ngắt máy'', KHÔNG được đặt câu hỏi vì dễ gây tranh cãi. / warning khi ở dạng câu hỏi.'
step49_20260805_manual_fn_batch4:
  name: Step49 20260805 Manual Fn Batch4
  positives:
  - id: 379b0fb1-9761-41ac-9c08-cb1efd6a35df
    content: sao anh dòng vo vậy
    severity: warning
    description: AGENT dùng cụm 'SAO anh VÒNG VO (dòng vo — biến âm ASR)' để gán nhãn cách trả lời của KH. gán nhãn cách nói qua câu hỏi tu từ chất vấn.
  - id: 65ad9746-621b-4030-bf5d-28db6ffca0b2
    content: anh có hiểu câu hỏi không anh
    severity: warning
    description: AGENT dùng câu hỏi tu từ 'anh có hiểu câu hỏi không' — chất vấn nhận thức/trình độ KH. mỉa mai. Chỉ áp dụng khi tone chất vấn/mỉa mai rõ ràng. Không áp dụng khi CB đang verify KH đã đọc/hiểu tài liệu vừa gửi trước khi chuyển bước ('anh đọc anh có hiểu không anh nói anh hiểu thì em gửi').
  - id: c50abf13-c3ce-46df-8a63-7bbce7749ae8
    content: mình chửi thì mình mệt thôi chứ bên em cũng đâu có biết làm sao đâu
    severity: warning
    description: AGENT phản hồi lời đe dọa chửi của KH bằng 'MÌNH CHỬI THÌ MÌNH MỆT thôi' — chế giễu ngược lại tác động của việc chửi lên chính KH. mỉa mai phản ứng KH nghiêm trọng (Thái độ cao, không phải warning).
  carveouts:
  - id: 2aff92dc-1f91-48e1-830a-01274832afc2
    content: sao mình lại nặng lời như vậy ạ
    severity: tich_cuc
    description: AGENT dùng câu hỏi tu từ 'sao mình lại nặng lời như vậy' để gán nhãn cách nói của KH. Bắt buộc có nhãn cụ thể ('nặng lời', 'to tiếng', 'gay gắt'). Không áp dụng cho câu hỏi verify chung chung khác ('sao anh lại bảo X', 'sao mình cứ lùi') không kèm nhãn thái độ.
  - id: afa277dc-ef83-49c0-bbf3-354361cd3a4f
    content: sao mình không thể nào mà mình lắng nghe bên phía ngân hàng trao đổi được ạ
    severity: tich_cuc
    description: AGENT dùng câu hỏi tu từ 'sao mình không thể nào mà lắng nghe ngân hàng trao đổi được' — chất vấn khả năng lắng nghe KH. Bắt buộc có 'sao mình' opening + subject là KH (mình / anh chị). Không áp dụng cho statement khách quan/advice ('thông tin đến từ hai chiều', 'chú không thể nào nghe một chiều được') mà không direct KH.
  - id: 45693a9d-3841-4ba7-81d2-e38d59957d6c
    content: anh trao đổi nhỏ tiếng thôi
    severity: tich_cuc
    description: AGENT ra mệnh lệnh 'anh trao đổi NHỎ TIẾNG thôi' — áp đặt âm lượng nói của KH. mệnh lệnh coi thường.
step50_20260805_manual_fn_batch5:
  name: Step50 20260805 Manual Fn Batch5
  positives:
  - id: b760ba35-0ce0-4ee2-8ab6-76c2403294ce
    content: anh quen thì anh phải biết được người ta ở đâu bây giờ anh lại còn hỏi ngược lại em là như nào hả anh
    severity: warning
    description: AGENT dùng câu hỏi tu từ 'anh QUEN thì PHẢI BIẾT.. anh lại còn HỎI NGƯỢC LẠI em' — chất vấn logic + gán nhãn 'hỏi ngược' cho BT3. chất vấn quan hệ/nhân thân qua câu hỏi tu từ.
step51_20260805_manual_fp_batch1:
  name: Step51 20260805 Manual Fp Batch1
  positives:
  - id: ba77a3cb-1204-48b7-b906-16d521286448
    content: em để anh nói chưa
    severity: warning
    description: Cụm 'em để anh nói chưa' — biến âm ASR của 'em có nghe anh nói không' (câu hỏi lịch sự check kết nối đầu cuộc gọi). KHÔNG phải mệnh lệnh chặn lời. carveout ASR variant.
  carveouts:
  - id: a00eecff-215e-4876-82e4-0c14c4117647
    content: công ty mình quen hay chậm công nợ mà chưa ra xử lý vậy ạ
    severity: tich_cuc
    description: AGENT hỏi 'công ty mình QUEN HAY CHẬM CÔNG NỢ mà chưa ra xử lý' — câu hỏi business về pattern thanh toán của công ty KH trong context B2B collection, không phải mỉa mai. carveout khi context là gọi thu hồi công ty.
  - id: f5a606c1-06fe-47c1-b12c-51f8469aa617
    content: nếu mình chưa bình tĩnh trao đổi bên em xin phép ngắt máy nhé
    severity: tich_cuc
    description: 'AGENT dùng ''nếu mình CHƯA BÌNH TĨNH trao đổi bên em xin phép NGẮT MÁY'' — closing template SAU KHI KH đã chửi tục nặng (''địt mẹ'', ''đụ mẹ'') ngay đầu cuộc gọi. Theo QC: ngắt máy kèm đánh giá thái độ KH khi KH đã chửi tục là hợp lệ. carveout.'
  - id: 66a87a6f-50b9-44a6-b925-f1129277936e
    content: em không cảm ơn chị nhá
    severity: tich_cuc
    description: Cụm 'em KHÔNG cảm ơn chị nhá' — có thể là biến âm ASR của 'em XIN cảm ơn chị nhá' (closing lịch sự). Theo QC chưa rõ ý đồ vi phạm. carveout khi phrase xuất hiện ở turn closing.
  - id: 6db02096-da05-42ef-911c-a6138f9c3700
    content: mình đang là cán bộ nhà nước về mà mình còn là giáo viên mầm non nữa mà để quá hạn như này nợ xấu và giờ bị khởi kiện như này thì thực chất là nó đang rất là ảnh hưởng đến cái uy tín của chị
    severity: tich_cuc
