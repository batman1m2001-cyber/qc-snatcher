    severity: tich_cuc
    description: 'AGENT observation kèm SOFTENER ''em thấy'' về việc KH đang nói chuyện với NGƯỜI Khác (không phải CB) + template ngắt máy lịch sự. Không phải cáo buộc, chỉ phản ánh trạng thái để giải thích lý do kết thúc. KIỂM TRA CUSTOMER turn ngay trước: nếu KH đang nói với người Khác (mượn đồ, gọi con, mua bán ở chợ..) → carveout. Fragment ''anh tiếp / anh tiếp tục'' đứng đầu KHÔNG phải mệnh lệnh mà là mở đầu template ngắt máy — kể cả biến thể ASR ''trao đổi với anh em'' (nhầm ''người ngoài'' → ''anh em''). KHÔNG áp dụng nếu (a) KH đang engage bình thường hỏi info nghiệp vụ, (b) là mệnh lệnh áp đặt độc lập (''anh im đi trao đổi với em'', ''anh dừng ngay việc anh đang làm'').'
  - id: 7e8f84a7-500e-43d2-9322-0a21ae5f6d3f
