    content: chờ đi anh xin phép ngắt máy | chờ đi bên em xin phép ngắt máy nhá | chờ đi anh ngân hà xin phép ngắt máy | trợ lý trốn nghe máy em ngắt máy nhá | trợ lý thả trôi em ngắt máy | nếu không trao đổi thì trợ lý trốn nghe máy em ngắt máy | chú đi học em xin ngắt máy em cảm ơn | trao đổi nhá chú đi học em xin ngắt máy
