    severity: tich_cuc
    description: AGENT phân tích nguyên nhân dẫn tới quá hạn, dùng ngôi thứ ba hoặc trung tính. Là phân tích nghiệp vụ. Không áp dụng nếu là quy lỗi trực tiếp có label ('đấy là do bản thân anh chị', 'xuất phát từ ý chí chủ quan của chị').
  - id: 83cc2f9b-5d48-4e3c-b490-9b65918bf22a
