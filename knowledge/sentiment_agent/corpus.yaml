    severity: tich_cuc
    description: AGENT đối chiếu thu nhập với dư nợ và chi tiêu để làm rõ khả năng thanh toán, có số liệu cụ thể. Là phân tích nghiệp vụ. Không áp dụng nếu là gán ý đồ ('anh không tìm mọi cách để trả nợ', 'hay là mình có tiền nhưng không muốn thanh toán').
  - id: 1461c201-42f2-4f00-af24-aad859812ae3
