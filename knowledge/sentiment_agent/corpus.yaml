    description: AGENT hỏi xác nhận ý định thanh toán bằng question tag 'á chị / phải không ạ'. Là xác minh nghiệp vụ. Không áp dụng nếu là gán ý đồ giả định ('hay là mình có tiền nhưng không muốn thanh toán', 'anh không muốn ngân hàng gọi để phải thanh toán').
  - id: 9680e11b-421a-4843-bc1a-87a0568c8236
    content: chị quên à chị hay bệnh gì mà chưa đóng à | mình bận gì hay có vấn đề gì mà chưa thu xếp được ạ
    severity: tich_cuc
    description: AGENT hỏi lý do KH chưa thanh toán bằng câu hỏi mở có question tag 'à / ạ'. Là khai thác nguyên nhân nghiệp vụ. Không áp dụng nếu là nghi ngờ lời KH ('ai lại bị cái bệnh đấy bao giờ', 'em chưa thấy ai kêu bệnh đấy').
  - id: 1415397e-4cc1-47f4-b640-10ad93a580b1
