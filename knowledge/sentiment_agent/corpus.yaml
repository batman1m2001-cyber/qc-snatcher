    severity: tich_cuc
    description: AGENT giải thích nguyên tắc cân đối tài chính khi vay. Là giải thích nghiệp vụ về quản lý khoản vay. Không áp dụng nếu là quy trách phẩm chất ('trong vai trò đi vay anh phải có trách nhiệm', giọng dạy đời).
  - id: 2b42963b-6008-4f90-815e-a0929c4897e8
