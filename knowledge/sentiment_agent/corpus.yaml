  carveouts:
  - id: 36dbe0f0-eaa1-4f0d-84d0-63103eb11cda
    content: không hợp tác trao đổi xin phép ngắt máy nhá | không trao đổi gì thế này bạn khác trao đổi sau nhá | mình không trao đổi bên em xin phép ngắt máy | anh không nghe máy em xin phép ngắt máy | mình không tiếp nhận thông tin ngân hàng xin phép ngắt máy | mình chưa sẵn sàng trao đổi bên em xin phép ngắt
    severity: tich_cuc
    description: AGENT xin phép ngắt máy khi KH không trao đổi/không hợp tác/không nghe máy/chưa sẵn sàng, kèm thông báo 'bạn khác sẽ liên hệ lại'. Là phản ánh trạng thái + closing lịch sự, không phải đe dọa. Không áp dụng nếu là mệnh lệnh trực tiếp ('phải hợp tác ngay', 'anh không hợp tác là không được').
  - id: 6afbeeb5-364a-41be-9a36-562e2dd336db
    content: em là quỳnh liên hệ từ ngân hàng win vui lòng nghe máy ngân hàng trao đổi ngân hàng ngắt máy trước gọi lại anh sau | chào anh em gọi từ win trao đổi khoản vay quá hạn ngân hàng xin phép ngắt máy sẽ liên hệ lại
    severity: tich_cuc
    description: AGENT đọc script mở đầu/kết thúc cuộc gọi tự động khi KH không bắt máy hoặc máy bận. Là script nghiệp vụ chuẩn (giới thiệu + lý do gọi + thông báo sẽ liên hệ lại), không phải phán xét KH. Nhận diện qua cấu trúc gồm tên CB, tên ngân hàng, lý do gọi và closing, nằm trong 1-2 lượt đầu cuộc gọi.
  - id: 922f108f-b7d6-4fd0-86d6-dbdc297d6a9b
    content: anh cho em xin thông tin cán bộ quản lý trực tiếp của mình để bên em gửi mail | cho em xin đơn vị quản lý của anh để ngân hàng gửi thông tin
    severity: tich_cuc
    description: AGENT xin thông tin đơn vị/cán bộ quản lý để gửi công văn theo quy trình nghiệp vụ. Là khai thác thông tin, không phải đe dọa liên hệ nơi làm việc. Không áp dụng cho 'bên em sẽ gọi lên công ty anh chị và đồng nghiệp'.
  - id: 924c9664-07c4-4da8-a3cd-35a80e5b0d87
    content: anh lấy căn cứ ở đâu mà anh nói là anh sẽ xử lý phần quá hạn | anh lấy căn cứ ở đâu để mà anh hứa hẹn bên phía ngân hàng
    severity: tich_cuc
    description: AGENT yêu cầu KH nêu cơ sở/kế hoạch thanh toán khi KH đã nhiều lần thất hẹn. Là xác minh cam kết trong nghiệp vụ thu hồi nợ. Không áp dụng nếu là chất vấn hoàn cảnh cá nhân KH ('anh có bằng chứng gì chứng minh anh thất nghiệp').
  - id: 73212639-cec5-4a7b-ad89-a22f35e9d6db
    content: bốn năm nay mình không làm công việc gì à | ngân hàng đợi mình bốn năm rồi mình vẫn chưa có nguồn thu à | mình hiện tại đang làm công việc gì ạ
    severity: tich_cuc
    description: AGENT khai thác tình trạng thu nhập/công việc của KH để đánh giá khả năng thanh toán, có kèm số liệu thời gian quá hạn cụ thể. Là khai thác nghiệp vụ thu hồi nợ. Không áp dụng nếu là dạy đời về việc làm ('sao anh không xin việc đi', 'thiếu gì việc') hoặc chê KH ('bận mà không có tiền thì bận làm gì').
  - id: 8353ead2-b10b-438c-8096-afb657b1b84c
    content: tháng trước anh cũng hứa với nhân viên ngân hàng ngày nào gọi ra cũng hứa | ngày nào gọi anh cũng hứa mà chưa thực hiện thanh toán
    severity: tich_cuc
    description: AGENT nêu lịch sử KH nhiều lần hứa nhưng chưa thanh toán, dạng trần thuật factual về các lần trao đổi trước. Là observation nghiệp vụ. Không áp dụng nếu có label mỉa mai ('hứa lèo', 'hứa suông', 'chuyên hứa rồi không làm', 'hứa cho vui').
  - id: 346d174c-4730-48bb-bf04-bf1caa9374dd
    content: để quá hạn còn ảnh hưởng đến lịch sử tín dụng của anh sau này gia đình con cái muốn vay cũng không được | quá hạn sẽ ảnh hưởng đến uy tín tín dụng cả gia đình
    severity: tich_cuc
    description: AGENT cảnh báo hệ quả tín dụng của việc quá hạn, kể cả ảnh hưởng tới người thân. Theo QC đây là nhóm câu cảnh báo thuộc nghiệp vụ thu hồi nợ, không bắt lỗi. Không áp dụng cho 'bên em sẽ gọi lên công ty anh chị và đồng nghiệp'.
  - id: 24aa6145-6276-4a21-9025-1a5d099e8d96
    content: em hơn ba mươi tuổi rồi bây giờ em không nghĩ đến việc trả nợ thì bao giờ trả xong | mình cũng ngoài ba mươi rồi cần có kế hoạch thanh toán
    severity: tich_cuc
    description: AGENT nhắc tuổi KH để nhấn mạnh cần có kế hoạch thanh toán. Theo QC không vi phạm khi CB nhắc độ tuổi nhằm nhấn mạnh việc KH cần có kế hoạch thanh toán. Không áp dụng cho 'anh chị lớn tuổi rồi thì có ý thức đi trả nợ đi' hoặc 'đến tuổi này rồi chị phải biết cách hỏi'.
  - id: f354f1aa-2693-4565-a14d-51e08f5984f3
    content: anh phải hoàn thành nghĩa vụ thanh toán của mình mình vay tiền mình sử dụng tiền thì phải có trách nhiệm | mình vay thì mình có nghĩa vụ trả nợ cho ngân hàng
    severity: tich_cuc
    description: AGENT nêu nghĩa vụ trả nợ theo hợp đồng vay. Theo QC là cụm câu được dùng trong nghiệp vụ thu hồi nợ, không bắt lỗi. Không áp dụng cho 'anh chị có ý thức trả nợ cho ngân hàng đi' hoặc 'anh là người lớn tuổi thì cũng phải nói chuyện lịch sự'.
  - id: 6db8a4a8-d368-493e-b85e-aa65f18d1812
    content: cô là bố chồng của chị phượng thì mình cũng phải biết về con dâu chưa ạ | cô cũng phải nắm bắt được thông tin này chứ ạ | chị ấy cũng phải thông báo lại về phía gia đình chứ | cháu tưởng là cùng thôn thì cũng phải biết thông tin chứ | chị là người nhà anh nếu mà chị không biết anh đang nợ bao nhiêu ạ | em tưởng anh là chồng của chị ấy mà cũng không nắm được cái này à cơ | thì cái thông tin này anh phải biết chứ ạ
    severity: tich_cuc
    description: AGENT hỏi/thắc mắc BT3 về việc nắm thông tin người thân, có softener 'chứ ạ', 'chưa ạ', 'à cơ', 'em tưởng'. Theo QC không bắt lỗi khi CB đặt câu hỏi thắc mắc dựa trên mối quan hệ nhằm khai thác, xác minh và làm rõ vấn đề. Không áp dụng cho 'mình là người nhà là vợ sao lại không biết anh gặp vướng mắc gì hả chị'.
  - id: 07f10e8f-3ad1-4c67-8cf6-a254c32c270b
    content: chị nói như thế khác nào thể hiện anh ấy đang coi thường pháp luật đúng không anh | nói vậy khác nào bảo là anh ấy không tôn trọng ngân hàng
    severity: tich_cuc
    description: AGENT diễn giải/nhắc lại nội dung KH đang trao đổi bằng cấu trúc 'nói như thế khác nào'. Theo QC không bắt bên thứ 3 khi câu thoại chỉ mang tính diễn giải, nhắc lại hoặc làm rõ nội dung KH đang trao đổi. Không áp dụng cho label trực tiếp 'khinh thường'.
  - id: e49807d6-1f53-4e52-a5a5-2ed18b980e0d
    content: em đang hỏi chị là mình có quen hay không ạ mình trả lời có hay không thôi ạ | anh cho em xin câu trả lời có hoặc không thôi ạ
    severity: tich_cuc
    description: AGENT nhắc lại câu hỏi và xin KH trả lời rõ có/không, có softener 'ạ'. Là làm rõ câu hỏi khi KH trả lời lan man. Không áp dụng nếu là mệnh lệnh cụt lủn không softener ('anh chị chỉ cần trả lời có hay không thôi').
  - id: 74f8b94b-c373-43c6-9d44-6244a44b5b4b
    content: anh ơi mình có đang trao đổi nghiêm túc không anh | mình trao đổi nghiêm túc được không ạ
    severity: tich_cuc
    description: AGENT hỏi KH có trao đổi nghiêm túc không, dạng câu hỏi có softener. Là điều hướng lịch sự. Chỉ bắt lỗi nếu là mệnh lệnh cụt lủn ('anh chị nghiêm túc đi') hoặc mỉa mai ('đó là nghiêm túc của anh đó hả', 'như thế mà gọi là nghiêm túc hả anh').
  - id: 7830372d-a99d-4c7b-a563-db45190c1de1
    content: chị trao đổi thì cho phải chuẩn mực chứ | mình trao đổi chuẩn mực giúp em nhá
    severity: tich_cuc
    description: AGENT nhắc KH giữ chuẩn mực trong cách trao đổi. Theo QC không bắt lỗi với từ 'chuẩn mực' khi dùng để điều hướng cuộc gọi. Không áp dụng nếu kèm dạy đời về vai trò xã hội ('là người lớn tuổi thì phải chuẩn mực', 'làm công an mà nói thế à').
  - id: 3c0fb9a4-5e40-4fa1-bbc0-f8ebd950cc6b
    content: nếu mình không cung cấp được thông tin trên cuộc gọi thì bên em vẫn ghi nhận đây là số điện thoại của chị và tiếp tục liên lạc lại nhá | ngân hàng ghi nhận số này và sẽ liên hệ lại sau ạ
    severity: tich_cuc
    description: AGENT xác nhận thông tin liên hệ và thông báo sẽ tiếp tục liên lạc. Là quy trình nghiệp vụ chuẩn. Không áp dụng nếu mang tone đe dọa gây áp lực ('nếu chị vẫn trao đổi kiểu này ngân hàng sẽ gọi lại tiếp chị nhá').
  - id: ac7f1840-7d50-4601-be87-f433f0c12746
    content: không phải là anh không có khả năng mà anh đang ưu tiên trả ở bên khác | ngân hàng không thể hỗ trợ khách hàng vẫn đang có thu nhập nhưng ưu tiên bên ngoài trước
    severity: tich_cuc
    description: AGENT phân tích khả năng thanh toán và thứ tự ưu tiên trả nợ của KH, giải thích điều kiện hỗ trợ của ngân hàng. Là phân tích nghiệp vụ dựa trên dữ liệu thu nhập. Không áp dụng nếu là gán ý đồ ('anh tìm lý do để trì hoãn', 'anh cố tình không trả').
  - id: a5f827d8-5cc3-4a16-8064-c0d6bb79d0fa
    content: biết thừa là anh để như này lãi phí phạt nó tăng lên rồi em cũng cho anh rất nhiều cơ hội | anh biết là để lâu thì phí phạt tăng mà bên em vẫn hỗ trợ nhiều lần
    severity: tich_cuc
    description: AGENT nhắc KH về hệ quả tài chính của việc chậm trả và số lần ngân hàng đã hỗ trợ. Là giải thích nghiệp vụ. Không áp dụng nếu là mỉa mai lời KH vừa nói ('em nghe là em thừa biết mà') hoặc gán ý đồ ('có phải anh cố tình để khoản nợ này đúng không').
  - id: c23a443c-f1a2-4109-8e7d-65a025c57cd0
    content: em nạp ở đâu thì em phải nhớ chứ làm sao mà em không nhớ được địa chỉ chính xác | mình giao dịch ở đâu thì cũng phải nhớ được chứ ạ
    severity: tich_cuc
    description: AGENT yêu cầu KH xác nhận/nhớ lại thông tin giao dịch để đối chiếu hồ sơ. Là xác minh thông tin nghiệp vụ. Không áp dụng nếu là mỉa mai nhận thức KH ('không nghe thấy sao trả lời được', 'anh biết rõ chứ sao lại không biết').
  - id: c64d84d4-6e89-4059-b319-0d6b26ba930f
    content: chắc tài khoản thì có tiền đâu ạ | chắc là mình chưa thu xếp được nguồn tiền phải không ạ
    severity: tich_cuc
    description: AGENT phỏng đoán tình trạng tài chính KH bằng 'chắc là' + question tag, để dẫn dắt sang trao đổi phương án. Là câu hỏi thăm dò nghiệp vụ. Không áp dụng nếu là mỉa mai đổ lỗi ('chắc tại ngân hàng hết', 'chắc ngân hàng làm khó anh rồi').
  - id: 3f9018c9-30fd-477f-83e9-c43525ef3ae1
    content: nếu như mà chưa sắp xếp được thì tại sao tháng trước mình lại hứa là cố gắng thu xếp để xử lý | tháng trước mình có cam kết thu xếp mà giờ chưa thực hiện được là do đâu ạ
    severity: tich_cuc
    description: AGENT nhắc lại cam kết cũ của KH và hỏi lý do chưa thực hiện. Là làm rõ khả năng thanh toán trong nghiệp vụ thu hồi nợ. Không áp dụng nếu là dạy đời về cách hứa ('khi hứa hẹn phải có căn cứ mới hứa') hoặc gán nhãn ('hứa hẹn nhiều lần rồi không giải quyết').
  - id: 6dbb5a0d-00a6-4b0d-8714-4237e872fe48
    content: em nghĩ tắc xi thì nó cũng phải khá hơn chứ anh ạ | công việc này thì thu nhập cũng phải được vài triệu chứ ạ
    severity: tich_cuc
    description: AGENT khai thác mức thu nhập theo nghề nghiệp KH đã khai để đánh giá khả năng thanh toán, có softener 'chứ ạ / em nghĩ'. Là khai thác nghiệp vụ. Không áp dụng nếu là chất vấn áp lực ('đi làm suốt thế thì cũng có tiền chứ đúng không').
  - id: c4c95165-8e0d-46b2-9d17-43ffb8573cce
    content: kể cả khó khăn thì người ta vẫn có thể chạy xe ôm hay làm những công việc khác | mình có thể tìm công việc khác để có nguồn thanh toán | cũng chưa phải là quá già thì sao chị không làm việc khác mà lại đi làm giúp việc không thôi
    severity: tich_cuc
    description: AGENT gợi ý phương án tạo thu nhập để KH có nguồn trả nợ. Theo QC không bắt lỗi khi CB đưa ra giải pháp về tài chính cho KH. Không áp dụng nếu là chê bai tư duy/năng lực KH ('tư duy không chấp nhận được', 'sao anh không xin việc đi hả anh', 'thiếu gì việc').
  - id: 71b284a4-a89c-4746-82a7-9a66352a57cb
    content: bạn bè người quen chạy phanh cũng mười mấy hai mươi triệu mà sao anh chạy có sáu bảy triệu | người khác làm công việc này thu nhập cũng khá hơn ạ
    severity: tich_cuc
    description: AGENT dùng thông tin tham chiếu về thu nhập của người khác để khai thác, xác minh mức thu nhập của KH. Theo QC không bắt lỗi khi CB dùng ví dụ tham chiếu để khai thác tình hình tài chính. Không áp dụng nếu là chê hoàn cảnh KH ('ai đi làm công nhân mà lương 5tr đâu').
  - id: 761dde51-6b7f-4f19-8c00-7ec629c8d929
    content: chị trước khi mở thẻ chị phải tìm hiểu chứ bây giờ đến những thông tin đấy chị còn muốn bên em chỉ từng cái | thông tin sản phẩm mình cần tìm hiểu trước khi đăng ký ạ
    severity: tich_cuc
    description: AGENT giải thích phạm vi hỗ trợ và trách nhiệm tìm hiểu thông tin sản phẩm của KH. Theo QC là giải thích phạm vi hỗ trợ, chỉ bắt lỗi nếu ngữ điệu thể hiện rõ mỉa mai, coi thường hoặc công kích KH.
  - id: d0bbe1b7-48c5-405f-97b7-6914ff4f4c64
    content: chị chủ động trễ hạn với ngân hàng lại còn bảo là nghe người này người kia để đợi quá hạn để được xử lý | mình nghe thông tin chưa chính xác từ bên ngoài về việc để quá hạn sẽ được giảm lãi ạ
    severity: tich_cuc
    description: AGENT đính chính thông tin sai KH nghe từ bên ngoài về việc để quá hạn sẽ được miễn giảm lãi. Theo QC là nội dung tư vấn, định hướng nghiệp vụ. Không áp dụng nếu là gán ý đồ ('anh cố tình để chậm hạn').
  - id: 5248b1fb-6757-4118-9945-88cabbeda8a3
    content: gặp khó khăn vui lòng lên tiếng trao đổi để được hỗ trợ chứ không phản hồi đây sẽ là một trong những chứng cứ làm việc tại tòa | việc mình không phản hồi sẽ được ghi nhận trong hồ sơ làm việc ạ
    severity: tich_cuc
    description: AGENT nêu hệ quả của việc KH không phản hồi trong quy trình xử lý hồ sơ. Theo QC là trao đổi đúng nghiệp vụ thu nợ. Không áp dụng nếu là đe dọa trực tiếp ('đây sẽ là căn cứ để chống lại anh trước tòa').
  - id: f6c6f947-a9b7-4e8b-bd78-26e56cbb3fad
    content: em nghĩ chị đúng là một người giám đốc và chị đủ hiểu biết để chị có thể ra tòa án để xử lý hay không | mình là người có kinh nghiệm nên chắc nắm được quy định này ạ
    severity: tich_cuc
    description: AGENT phân tích với KH về quy định pháp luật và trách nhiệm khi xử lý tại tòa, có nhắc vai trò/hiểu biết của KH theo hướng ghi nhận. Theo QC là phân tích nghiệp vụ. Không áp dụng nếu là mỉa mai vai trò ('là giám đốc mà cũng để nợ xấu à').
  - id: 475c2af8-2391-4db3-b37c-d77c28a0a6ce
    content: nợ sẵn thì bên em đã ghi nhận thông tin và trao đổi với chị rồi nhưng mà chị không xử lý | em đã phân tích với mình nhiều lần về lý do chưa xử lý được khoản này
    severity: tich_cuc
    description: AGENT phân tích, phản biện hoặc nhắc lại lý do KH chưa xử lý khoản nợ. Theo QC không bắt lỗi với nhóm câu này. Không áp dụng nếu kèm gán nhãn ('chị lấy cái lý do này ra để không thanh toán').
  - id: 74caba2c-c1d4-4df3-b19e-0074c38795a9
    content: sao anh dùng không anh hỏi kỹ thế anh | em hỏi lại cho rõ là mình có dùng số này không ạ
    severity: tich_cuc
    description: AGENT hỏi lại để làm rõ thông tin KH vừa cung cấp. Là xác minh nghiệp vụ. Không áp dụng nếu là chất vấn nhận thức ('anh có hiểu câu hỏi không') hoặc chất vấn động cơ ('anh bảo không quen mà hỏi thông tin làm gì').
  - id: e80fec68-2fbf-4f8b-9569-e3be40f317ef
    content: là anh em trong một nhà nhưng mà cũng không rõ tình hình anh hoàng như nào anh bỏ đi hay như nào thế ạ | mình là người nhà thì có nắm được anh ấy hiện đang ở đâu không ạ
    severity: tich_cuc
    description: AGENT hỏi BT3 để làm rõ tình trạng/hoàn cảnh của người vay, có softener 'thế ạ / hả anh / không ạ'. Là xác minh thông tin nghiệp vụ. Không áp dụng nếu là khẳng định thách thức quan hệ ('vợ chồng vẫn ở với nhau mà thế nào lại không liên quan').
  - id: d08636b0-6ffb-4dc0-be19-f40acac9b0ed
    content: không muốn thực hiện thanh toán cho phía bên ngân hàng á chị | mình chưa muốn thanh toán phải không ạ
